<!DOCTYPE html>
<html lang="ko">

<title>BOUNDY METACADY</title>
<style>
:root {
  --bg: #15191f; --panel: #1d232b; --panel2: #232a34; --line: #313a47; --text: #d7dee8; --dim: #8693a3; --acc: #3d8bff; --acc2: #2a6fdb; --ok: #3ddc84;
  font-family: "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif; font-size: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; user-select: none; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
#app { display: flex; flex-direction: column; height: 100vh; }

/* 리본: 탭 + 큰 버튼 */
#ribbon { background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
.topRow { display: flex; align-items: flex-end; gap: 8px; padding: 3px 9px 0; border-bottom: 1px solid var(--line); background: #181d24; }
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 0 10px 5px 2px; }
.brand b { font-size: 13.5px; letter-spacing: 1px; white-space: nowrap; } .brand b i { font-style: normal; } .brand .b1 { color: #ffffff; } .brand .b2 { color: #3d8bff; } .brand span { color: var(--dim); font-size: 10px; white-space: nowrap; letter-spacing: .3px; }
.tabs { display: flex; gap: 2px; flex: 1; overflow-x: auto; overflow-y: hidden; align-items: flex-end; }
.tab { background: none; border: 1px solid transparent; border-bottom: none; border-radius: 7px 7px 0 0; padding: 5px 12px; font-size: 12px; color: var(--dim); white-space: nowrap; }
.tab:hover { color: #fff; background: var(--panel2); } .tab.on { background: var(--panel); border-color: var(--line); color: #fff; font-weight: 600; position: relative; top: 1px; }
.tab.fsTab { margin-left: 8px; border: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 7px; color: #9fc3ff; }
.tab.fsTab:hover { color: #fff; background: var(--acc2); border-color: var(--acc); }
.tab.fsTab.on { background: var(--acc); border-color: var(--acc); color: #fff; top: 0; }
.tab.langTab { margin-left: 6px; border: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 7px; color: #9fc3ff; }
.tab.langTab:hover { color: #fff; background: var(--acc2); border-color: var(--acc); }
.quick { display: flex; gap: 2px; padding-bottom: 4px; }
.qbtn { display: flex; align-items: center; gap: 4px; background: none; border: 1px solid transparent; border-radius: 5px; padding: 3px 8px; color: var(--text); white-space: nowrap; }
.qbtn svg { width: 15px; height: 15px; color: #9fc3ff; } .qbtn:hover { background: var(--panel2); border-color: var(--line); }
.tools { display: flex; align-items: stretch; gap: 2px; padding: 4px 8px; overflow-x: auto; overflow-y: hidden; min-height: 60px; }
.tools::-webkit-scrollbar, .tabs::-webkit-scrollbar { height: 5px; }
.tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 60px; flex: none; height: 52px; background: none; border: 1px solid transparent; border-radius: 7px; padding: 3px 6px; }
.tool svg { width: 22px; height: 22px; color: #9fc3ff; } .tool span { font-size: 10.5px; line-height: 1.15; text-align: center; white-space: nowrap; }
.tool:hover { background: var(--panel2); border-color: var(--line); } .tool:hover svg { color: #fff; }
.tool.act, .qbtn.act { background: var(--acc2); border-color: var(--acc); color: #fff; } .tool.act svg { color: #fff; }
.tools .sep { width: 1px; background: var(--line); margin: 5px 4px; flex: none; }
.tipCard { position: fixed; z-index: 60; max-width: 290px; background: #0f1319; border: 1px solid var(--acc); border-radius: 8px; padding: 9px 12px; box-shadow: 0 8px 26px rgba(0,0,0,.6); pointer-events: none; }
.tipCard b { font-size: 13px; color: #fff; } .tipCard kbd { float: right; font: 11px Consolas, monospace; color: #9fc3ff; margin-left: 14px; padding-top: 2px; } .tipCard p { margin: 5px 0 0; line-height: 1.55; color: var(--text); }

/* 안내 막대 */
#guide { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); display: flex; align-items: center; gap: 12px; background: rgba(18,24,33,.95); border: 1px solid var(--acc); border-radius: 12px; padding: 8px 10px 8px 12px; box-shadow: 0 8px 28px rgba(0,0,0,.5); z-index: 5; }
#guide:empty { display: none; }
#guide.idle { border-color: var(--line); background: rgba(18,24,33,.7); box-shadow: none; padding: 5px 14px; pointer-events: none; }
.gCmd { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; padding-right: 12px; border-right: 1px solid var(--line); } .gCmd svg { width: 22px; height: 22px; color: #9fc3ff; }
.gMain { min-width: 0; } .gStep { font-size: 14px; color: #ffd479; font-weight: 600; white-space: nowrap; } .gHint { font-size: 11px; color: var(--dim); margin-top: 2px; }
#guide.idle .gHint { margin: 0; font-size: 11.5px; white-space: nowrap; }
.gOpts { display: flex; gap: 5px; flex: 0 1 auto; flex-wrap: wrap; }
.gMain .gHint { max-width: 380px; }
.gb { display: flex; align-items: center; gap: 5px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; font-size: 12.5px; white-space: nowrap; } .gb svg { width: 15px; height: 15px; }
.gb:hover { border-color: var(--acc); background: #2b3644; } .gb.ok { background: #1f7a45; border-color: #35b06a; color: #fff; } .gb.ok:hover { background: #249152; } .gb.cancel { color: #ffb3b3; } .gb.cancel:hover { border-color: #e06666; }

/* 도면 겹치기 탭 */
#sheets { display: flex; align-items: center; gap: 4px; background: #181d24; border-bottom: 1px solid var(--line); padding: 3px 8px; flex: none; overflow-x: auto; overflow-y: hidden; }
.shTitle { display: flex; align-items: center; gap: 5px; color: var(--dim); margin-right: 6px; white-space: nowrap; } .shTitle svg { width: 15px; height: 15px; }
.sheet { display: flex; align-items: center; gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px 5px 0 0; padding: 2px 4px; cursor: pointer; white-space: nowrap; }
.sheet .nm { padding: 0 5px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
.sheet.act { background: var(--acc2); border-color: var(--acc); color: #fff; } .sheet.off .nm { opacity: .45; text-decoration: line-through; }
.shAdd { background: none; border: 1px dashed var(--line); border-radius: 4px; color: var(--dim); padding: 2px 8px; white-space: nowrap; } .shAdd:hover { color: #fff; border-color: var(--acc); }
.mini { background: none; border: none; padding: 0 3px; min-width: 20px; height: 20px; border-radius: 3px; font-size: 11px; } .mini:hover { background: rgba(255,255,255,.14); }

/* 본문 */
#main { flex: 1; display: flex; min-height: 0; }
#canvasWrap { flex: 1; position: relative; min-width: 0; background: #1f242b; }
#canvasWrap canvas { position: absolute; left: 0; top: 0; } #cvOver { cursor: none; }
#side { width: 290px; flex: none; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#layerPanel { flex: 1 1 40%; display: flex; flex-direction: column; min-height: 84px; border-bottom: 1px solid var(--line); transition: box-shadow .3s; } #layerPanel.flash { box-shadow: inset 0 0 0 2px var(--acc); }
#propPanel { flex: 1 1 60%; display: flex; flex-direction: column; min-height: 96px; }
.panelHead { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; background: var(--panel2); font-weight: 600; flex: none; }
.headBtns button { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 1px 7px; margin-left: 3px; font-weight: 400; } .headBtns button:hover { border-color: var(--acc); }
#layerList, #propBody { overflow-y: auto; flex: 1; padding: 3px; }
.lay { display: flex; align-items: center; gap: 2px; padding: 1px 2px; border-radius: 3px; } .lay:hover { background: var(--panel2); } .lay.cur { background: rgba(61,139,255,.2); }
.lay .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 3px; }
.lay select { width: 78px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; height: 20px; font-size: 11px; } .lay select:last-child { width: 50px; }
.chip { width: 16px; height: 16px; border: 1px solid #000; outline: 1px solid var(--line); border-radius: 2px; flex: none; padding: 0; }
.prow { display: flex; align-items: center; gap: 6px; padding: 1px 5px; } .prow label { width: 104px; flex: none; color: var(--dim); }
.prow input, .prow select, .form select, .form input[type=number] { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; height: 22px; padding: 0 5px; user-select: text; }
.prow input:focus, .prow select:focus { border-color: var(--acc); outline: none; } .prow.ro span { user-select: text; }
.colorBtn { flex: 1; display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; height: 23px; padding: 0 5px; } .colorBtn i { width: 14px; height: 14px; border: 1px solid #000; outline: 1px solid var(--line); }
.hint { color: var(--dim); padding: 7px 6px; line-height: 1.55; font-size: 11px; }

/* 명령 영역 */
#cmdArea { flex: none; background: #12161b; border-top: 1px solid var(--line); }
#cmdHist { height: 58px; overflow-y: auto; padding: 3px 9px; color: var(--dim); font-family: Consolas, "Malgun Gothic", monospace; line-height: 1.45; user-select: text; }
#cmdLine { display: flex; align-items: center; gap: 8px; padding: 4px 9px; border-top: 1px solid var(--line); background: #0e1115; }
#cmdPrompt { color: #ffd479; white-space: nowrap; font-family: Consolas, "Malgun Gothic", monospace; max-width: 75%; overflow: hidden; text-overflow: ellipsis; }
#cmdInput { flex: 1; background: none; border: none; outline: none; color: #fff; font-family: Consolas, "Malgun Gothic", monospace; font-size: 13px; user-select: text; }
#status { flex: none; display: flex; align-items: center; gap: 12px; background: var(--panel); border-top: 1px solid var(--line); padding: 2px 9px; height: 25px; }
#stCoords { width: 190px; font-family: Consolas, monospace; color: #cfe1ff; } #stInfo { margin-left: auto; color: var(--dim); }
.tg { background: none; border: 1px solid var(--line); border-radius: 3px; padding: 1px 8px; margin-right: 3px; color: var(--dim); } .tg.on { background: rgba(61,139,255,.25); border-color: var(--acc); color: #fff; }

/* 팝업 · 대화상자 */
.pop { position: fixed; z-index: 50; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 7px; width: 262px; box-shadow: 0 8px 28px rgba(0,0,0,.55); }
.pop .sw { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; } .pop .sw button { height: 18px; border: 1px solid #000; padding: 0; border-radius: 2px; } .pop .sw button.on { outline: 2px solid #fff; }
.pop .byl { width: 100%; margin-bottom: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 3px; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 40; } #modal.hidden { display: none; }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: min(820px, 94vw); max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 16px 50px rgba(0,0,0,.6); }
.dlgHead { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--line); } .dlgHead .x { background: none; border: none; font-size: 14px; }
.dlgBody { padding: 12px 14px; overflow-y: auto; user-select: text; } .dlgFoot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.dlg button { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 13px; } .dlg button:hover { border-color: var(--acc); } .dlg button.primary { background: var(--acc2); border-color: var(--acc); color: #fff; }
.help p { margin: 0 0 8px; line-height: 1.65; } .cmdTable { width: 100%; border-collapse: collapse; } .cmdTable th, .cmdTable td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); } .cmdTable tr:hover td { background: var(--panel2); cursor: pointer; } .cmdTable td:first-child { color: #9fc3ff; font-family: Consolas, monospace; }
.checks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 20px; font-size: 13px; } .form .prow label { width: 90px; } .form .chk { display: block; padding: 5px; }
.fontDlg .frowTop { display: flex; gap: 8px; margin-bottom: 4px; } .fontDlg .frowTop input { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; user-select: text; }
.secT { color: var(--dim); margin: 9px 0 5px; font-weight: 600; } .fontReg { display: flex; flex-wrap: wrap; gap: 5px; min-height: 26px; }
.tag { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 3px 10px; cursor: pointer; font-size: 13px; } .tag.cur { background: var(--acc2); border-color: var(--acc); color: #fff; } .tag b { opacity: .6; } .tag b:hover { opacity: 1; }
.fontList { border: 1px solid var(--line); border-radius: 5px; height: 300px; overflow-y: auto; }
.frow { display: flex; align-items: center; gap: 10px; padding: 4px 9px; border-bottom: 1px solid var(--line); } .frow.on { background: rgba(61,139,255,.13); }
.frow .fn { width: 190px; flex: none; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .frow .fs { flex: 1; font-size: 17px; white-space: nowrap; overflow: hidden; color: #fff; }
::-webkit-scrollbar { width: 9px; height: 9px; } ::-webkit-scrollbar-thumb { background: #3a4554; border-radius: 5px; } ::-webkit-scrollbar-track { background: transparent; }

/* 도움말 */
.dlg.wide { width: min(1100px, 96vw); height: 90vh; } .dlg.wide .dlgBody { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.helpDlg { display: flex; flex-direction: column; gap: 9px; min-height: 0; flex: 1; }
.helpQ { background: var(--bg); border: 1px solid var(--acc); border-radius: 8px; padding: 9px 13px; font-size: 14px; user-select: text; outline: none; }
.helpNav { display: flex; flex-wrap: wrap; gap: 5px; } .helpNav button { border-radius: 14px; padding: 4px 12px; font-size: 12px; }
.helpBody { overflow-y: auto; flex: 1; padding-right: 6px; } .helpBody h3 { margin: 16px 0 8px; font-size: 15px; color: #fff; border-left: 4px solid var(--acc); padding-left: 9px; } .helpBody section:first-child h3 { margin-top: 2px; }
.hCard { display: flex; align-items: flex-start; gap: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-bottom: 6px; }
.hIcon { width: 46px; height: 46px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 9px; } .hIcon svg { width: 28px; height: 28px; color: #9fc3ff; }
.hTxt { flex: 1; min-width: 0; line-height: 1.6; } .hName { font-size: 14px; font-weight: 700; color: #fff; } .hName kbd { margin-left: 9px; font: 11px Consolas, monospace; color: #9fc3ff; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-weight: 400; }
.hDesc { color: var(--text); font-size: 12.5px; } .hSteps { color: #ffd479; font-size: 12px; margin-top: 3px; }
.dlg .hTry { flex: none; align-self: center; background: var(--acc2); border-color: var(--acc); color: #fff; white-space: nowrap; }
.hRow { display: flex; gap: 14px; padding: 6px 4px; border-bottom: 1px solid var(--line); line-height: 1.6; font-size: 12.5px; } .hRow b { width: 270px; flex: none; color: #cfe1ff; font-weight: 600; } .hRow span { flex: 1; }

/* 좁은 화면 대응 */
@media (max-width: 1150px) { .gMain .gHint { display: none; } .qbtn span { display: none; } .qbtn { padding: 4px 6px; } .tab { padding: 5px 9px; } #side { width: 250px; } }
@media (max-width: 800px) { #side { display: none; } }

/* 흰 바탕 작업 모드 */
body.lightCanvas #canvasWrap { background: #ffffff; }
body.lightCanvas #guide.idle { background: rgba(255,255,255,.85); border-color: #c4ccd6; } body.lightCanvas #guide.idle .gHint { color: #4a5563; }

/* 제작자 · 저작권 */
.credit { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; background: #0f1319; border: 1px solid var(--acc); border-radius: 10px; padding: 11px 16px; flex: none; }
.crLogo { font-size: 17px; font-weight: 800; letter-spacing: 1.2px; white-space: nowrap; } .crLogo i { font-style: normal; } .crLogo .b1 { color: #fff; } .crLogo .b2 { color: #3d8bff; } .crLogo span { display: block; font-size: 10px; font-weight: 400; color: var(--dim); letter-spacing: 0; }
.crInfo { line-height: 1.75; font-size: 13px; white-space: nowrap; } .credit b { display: inline-block; width: 52px; color: var(--dim); font-weight: 600; } .crInfo a { color: #9fc3ff; text-decoration: none; }
.crLaw { flex: 1; min-width: 300px; font-size: 12.5px; line-height: 1.6; } .crBan { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; } .crBan span { background: rgba(224,82,82,.16); border: 1px solid #e05252; color: #ffc9c9; border-radius: 12px; padding: 1px 10px; font-weight: 600; white-space: nowrap; }
.crNote { color: var(--dim); font-size: 11.5px; }
.crMarks { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; } .crMarks svg { width: 30px; height: 30px; display: block; } .crMarks em { font-style: normal; font-weight: 800; letter-spacing: 1.5px; font-size: 12px; color: #fff; margin-left: 8px; white-space: nowrap; }

/* 버전 팝업 */
.brand { cursor: pointer; border-radius: 6px; } .brand:hover b { filter: brightness(1.25); }
.dlg.ver { width: min(560px, 94vw); } .verDlg { text-align: center; }
.vLogo { font-size: 30px; font-weight: 800; letter-spacing: 2px; margin-top: 6px; } .vLogo i { font-style: normal; } .vLogo .b1 { color: #fff; } .vLogo .b2 { color: #3d8bff; }
.vSub { color: #cfd8e3; margin: 4px 0 14px; font-size: 14px; letter-spacing: .5px; }
.vTable { text-align: left; background: #0f1319; border: 1px solid var(--line); border-radius: 9px; padding: 8px 14px; margin-bottom: 12px; }
.vRow { display: flex; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; } .vRow:last-child { border-bottom: none; } .vRow b { width: 64px; flex: none; color: var(--dim); font-weight: 600; } .vRow a { color: #9fc3ff; text-decoration: none; }
.verDlg .crMarks { justify-content: center; } .vCopy { font-size: 12.5px; margin: 4px 0 7px; } .verDlg .crBan { justify-content: center; } .verDlg .secT { text-align: left; margin-top: 14px; }

.vNote { color: var(--dim); font-size: 12px; margin-top: 12px; }
.dlg.hist { width: min(820px, 95vw); } .hVer h3 { margin: 8px 0 8px; font-size: 16px; color: #fff; border-left: 4px solid var(--acc); padding-left: 9px; } .hVer h3 span { margin-left: 10px; font-size: 12px; font-weight: 400; color: #ffd479; }
.histDlg .vHist td:first-child { width: 150px; color: #9fc3ff; font-family: inherit; font-weight: 600; white-space: normal; word-break: keep-all; vertical-align: top; line-height: 1.5; padding-right: 12px; }
.histDlg .vHist td:nth-child(2) { white-space: normal; line-height: 1.65; vertical-align: top; } .histDlg .vHist { table-layout: fixed; }

/* 흉내그리기 · AI */
#refBar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: none; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100% - 24px); background: rgba(18,24,33,.95); border: 1px solid #d9a441; border-radius: 12px; padding: 7px 12px; z-index: 5; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
#refBar.show { display: flex; } #refBar b { color: #ffd479; } #refBar label { display: flex; align-items: center; gap: 5px; color: var(--dim); } #refBar input[type=range] { width: 90px; }
#refBar button { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; white-space: nowrap; } #refBar button:hover { border-color: var(--acc); } #refBar button.danger { color: #ffb3b3; }
#toast { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); width: max-content; max-width: min(720px, calc(100% - 30px)); background: rgba(10,14,20,.95); border: 1px solid var(--acc); border-radius: 10px; padding: 9px 16px; font-size: 13px; line-height: 1.5; color: #fff; z-index: 6; opacity: 0; pointer-events: none; transition: opacity .25s; text-align: center; } #toast.show { opacity: 1; }
#aiBusy { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; gap: 14px; background: rgba(8,11,16,.72); z-index: 8; font-size: 15px; color: #fff; } #aiBusy.show { display: flex; }

  "빈 도면으로 새로 시작합니다.": "Start fresh with a blank drawing.",
  "저장해 둔 도면(.mcd)이나 오토캐드 DWG · DXF 파일을 엽니다. DWG는 읽기 전용이며(AutoCAD 2004 ~ 2018 형식), 고친 뒤에는 .mcd나 DXF로 저장합니다.": "Open a saved drawing (.mcd) or an AutoCAD DWG / DXF file. DWG files are read-only (AutoCAD 2004 – 2018 formats); after editing, save as .mcd or DXF.",
  "PDF · JPG · PNG · 투명 PNG · SVG · DXF · MCD 중에서 골라 저장합니다. PDF와 그림은 용지(A0~A4, B1~B4) · 방향 · 축척 · 해상도를 정할 수 있습니다.": "Save as PDF · JPG · PNG · transparent PNG · SVG · DXF · MCD. For PDF and images you can set the paper (A0–A4, B1–B4) · orientation · scale · resolution.",
  "지금 도면을 이 프로그램의 고유 형식(.mcd)으로 저장합니다. 겹친 도면도 함께 저장됩니다.": "Save the current drawing in this program's native format (.mcd). Overlaid drawings are saved together.",
  "다른 이름의 새 파일로 저장합니다.": "Save as a new file with a different name.",
  "오토캐드 등 다른 CAD에서 열 수 있는 DXF 파일(AutoCAD 2000 형식)로 내보냅니다. 빗금 무늬 · 여러 줄 문자 · 타원 · 치수 · 선 굵기가 그대로 담깁니다.": "Export a DXF file (AutoCAD 2000 format) that can be opened in AutoCAD and other CAD programs. Hatch patterns · multiline text · ellipses · dimensions · lineweights are preserved.",
  "일러스트·웹용 벡터 그림(SVG)으로 내보냅니다.": "Export as a vector image (SVG) for illustration software and the web.",
  "A0~A4, B1~B4 용지에 축척을 맞춰 인쇄하거나 PDF로 저장합니다.": "Print on A0–A4 or B1–B4 paper at the chosen scale, or save as PDF.",
  "조작법과 전체 명령 목록을 봅니다.": "See how to operate the program and the full command list.",
  "종이 도면 사진 · 스캔 · 캡처 그림(JPG/PNG)을 반투명 밑그림으로 깔고 그 위에 따라 그립니다. 직접 그리거나, 이 프로그램이 자동으로(AI 없이) 그리거나, AI가 자동으로 그리게 할 수 있습니다. 화면을 캡처한 뒤 Ctrl+V로 붙여넣어도 됩니다.": "Place a photo, scan or screenshot (JPG/PNG) of a paper drawing as a semi-transparent underlay and trace over it. You can draw by hand, let this program trace automatically (no AI), or have AI trace it. You can also take a screenshot and paste it with Ctrl+V.",
  "자동 덧그리기(AI)에 쓰는 Gemini 유료 API 키를 등록 · 삭제합니다. 버튼이 하늘색이면 키 정상, 빨간색이면 이상입니다.": "Register or delete the paid Gemini API key used for automatic tracing (AI). A sky-blue button means the key is OK; red means a problem.",
  "도면 전체를 흰 바탕의 PNG 그림 파일로 저장합니다. 문서나 메신저에 붙여 넣을 때 씁니다.": "Save the whole drawing as a PNG image with a white background. Use it to paste into documents or messengers.",
  "두 점을 찍어 직선을 그립니다. 계속 찍으면 선이 이어집니다.": "Click two points to draw a straight line. Keep clicking to continue the line.",
  "여러 구간이 하나로 이어진 선을 그립니다. 중간에 둥근 호 구간도 넣을 수 있습니다.": "Draw a line made of several connected segments. You can include rounded arc segments in between.",
  "중심을 찍고 반지름을 정해 원을 그립니다.": "Click the center and set the radius to draw a circle.",
  "세 점을 찍어 호(원의 일부)를 그립니다.": "Click three points to draw an arc (part of a circle).",
  "대각선의 두 구석을 찍어 사각형을 그립니다. 두 번째 점에 100,50 처럼 가로,세로를 입력해도 됩니다.": "Click two opposite corners to draw a rectangle. For the second point you can also type width,height such as 100,50.",
  "정삼각형 · 정육각형 같은 정다각형을 그립니다. 작은 창에서 변의 수와 크기(한 변의 길이 / 꼭짓점까지 / 맞변 거리), 회전을 숫자로 정한 뒤 도면에서 놓을 자리만 클릭하면 됩니다.": "Draw a regular polygon such as an equilateral triangle or a regular hexagon. In the small box set the number of sides, size (side length / to vertex / across flats) and rotation, then just click where to place it in the drawing.",
  "타원을 그립니다. 작은 창에서 가로 지름 · 세로 지름 · 회전을 숫자로 정한 뒤 도면에서 중심이 될 곳만 클릭하면 됩니다.": "Draw an ellipse. In the small box set the horizontal diameter · vertical diameter · rotation, then just click the center point in the drawing.",
  "점을 찍습니다.": "Place a point.",
  "닫힌 도형 안을 빗금(단면 표시)이나 색으로 채웁니다.": "Fill the inside of a closed shape with hatching (section marks) or a color.",
  "선택한 객체를 옮깁니다. 작은 창에 가로 · 세로로 몇 mm 옮길지 숫자를 넣으면 됩니다(+ = 오른쪽 · 위, − = 왼쪽 · 아래). 화살표 버튼, 거리 + 각도 입력도 됩니다. 마우스로 옮기려면 객체를 누른 채 끌거나 창의 [마우스로 직접 옮기기]를 누르세요.": "Move the selected objects. In the small box enter how many mm to move horizontally and vertically (+ = right · up, − = left · down). Arrow buttons and distance + angle input also work. To move with the mouse, press and drag the object or press [Move with Mouse] in the box.",
  "선택한 객체를 복사해 여러 곳에 붙입니다.": "Copy the selected objects and paste them in several places.",
  "객체를 돌립니다. 작은 창에 몇 도 돌릴지 숫자를 넣으면 됩니다(+ = 왼쪽 · 반시계, − = 오른쪽 · 시계). 90° · 45° 같은 빠른 버튼과 회전 중심 선택이 있습니다.": "Rotate objects. In the small box enter the angle in degrees (+ = left · counterclockwise, − = right · clockwise). It has quick buttons such as 90° · 45° and a choice of rotation center.",
  "대칭선을 기준으로 거울에 비친 모양을 만듭니다.": "Create a mirror image about a mirror line.",
  "객체를 키우거나 줄입니다. 작은 창에 몇 %로 할지 숫자를 넣으면 됩니다(100 = 그대로, 50 = 절반, 200 = 두 배). 표 · 기호 · 도형 묶음의 크기를 맞출 때 편리합니다.": "Enlarge or reduce objects. In the small box enter the percentage (100 = unchanged, 50 = half, 200 = double). Handy for matching the size of tables · symbols · groups of shapes.",
  "영역으로 감싼 부분만 잡아 늘이거나 줄입니다.": "Stretch or shrink only the part enclosed by a selection window.",
  "선·원·도형을 일정 간격만큼 떨어뜨려 나란히 복사합니다. (벽 두께, 배관 폭 등)": "Copy a line, circle or shape in parallel at a set distance. (wall thickness, pipe width, etc.)",
  "다른 선과 만나는 곳을 기준으로, 필요 없는 부분을 클릭해 잘라냅니다.": "Click the unwanted part to cut it away, using the intersections with other lines as boundaries.",
  "선을 가장 가까운 다른 선까지 늘립니다.": "Extend a line to the nearest other line.",
  "두 선이 만나는 모서리를 둥글게 만듭니다.": "Round the corner where two lines meet.",
  "두 선이 만나는 모서리를 비스듬히 깎습니다.": "Cut the corner where two lines meet at an angle.",
  "객체를 바둑판 모양이나 원형으로 여러 개 복사합니다.": "Copy objects in a grid or circular pattern.",
  "끝이 맞닿은 선과 호를 하나의 이어진 선으로 합칩니다.": "Merge lines and arcs whose ends touch into a single polyline.",
  "블록·이어진 선·치수를 낱개 객체로 풉니다.": "Break blocks, polylines and dimensions into separate objects.",
  "선택한 객체를 지웁니다. (Delete 키와 같음)": "Erase the selected objects. (Same as the Delete key)",
  "도면에 글자를 씁니다. [가운데 맞춤]을 고르면 찍은 점이 글자의 정중앙이 되어 기호 · 표 안에 넣기 좋습니다.": "Write text in the drawing. If you choose [Center], the point you click becomes the exact center of the text, which is handy inside symbols and tables.",
  "이미 쓴 문자나 치수 숫자를 고칩니다. (문자를 더블클릭해도 됩니다)": "Edit text you have already written or a dimension value. (You can also double-click the text)",
  "화살표가 달린 선과 설명 글을 넣습니다.": "Add a line with an arrow and a note.",
  "두 점 사이의 가로 또는 세로 길이를 표시합니다.": "Show the horizontal or vertical length between two points.",
  "기울어진 두 점 사이의 실제 길이를 표시합니다.": "Show the true length between two points at an angle.",
  "원이나 호의 반지름(R)을 표시합니다.": "Show the radius (R) of a circle or arc.",
  "원의 지름(Ø)을 표시합니다.": "Show the diameter (Ø) of a circle.",
  "두 선 사이의 각도를 표시합니다.": "Show the angle between two lines.",
  "원의 중심에 십자 중심선을 그립니다.": "Draw a cross-shaped center line at the center of a circle.",
  "이 PC의 Windows 글꼴은 자동으로 연동되어, 문자의 [글꼴] 목록에서 바로 고를 수 있습니다. 목록 맨 아래 [＋ Windows 글꼴 모두 불러오기…]를 한 번 누르면(브라우저가 허용을 물음) 설치된 글꼴 전체가 들어오고 다음부터는 자동입니다. 이 창에서는 자주 쓰는 글꼴을 ★ 등록해 목록 위쪽에 모아 둘 수 있습니다.": "The Windows fonts on this PC are linked automatically, so you can pick them directly from the text [Font] list. Press [+ Load All Windows Fonts…] at the bottom of the list once (the browser asks for permission) to bring in all installed fonts; after that it is automatic. In this window you can ★ register frequently used fonts to keep them at the top of the list.",
  "자주 쓰는 모양(설비·부품 기호)을 하나의 블록으로 묶어 등록합니다.": "Group frequently used shapes (equipment · part symbols) into a block and register it.",
  "등록해 둔 블록을 도면에 배치합니다.": "Place a registered block in the drawing.",
  "한 객체의 레이어·색·선 모양을 다른 객체에 그대로 입힙니다.": "Apply one object's layer · color · linetype to other objects as is.",
  "두 점 사이의 거리와 각도를 잽니다.": "Measure the distance and angle between two points.",
  "점들을 찍어 둘러싼 면적과 둘레를 잽니다.": "Click points to measure the enclosed area and perimeter.",
  "선택한 객체의 길이·반지름 등 정보를 봅니다.": "See information such as length and radius of the selected objects.",
  "기계 부품도 / 공장 도면용 레이어 묶음을 한 번에 만듭니다.": "Create a set of layers for mechanical part drawings / plant drawings in one step.",
  "도면 전체가 화면에 꽉 차게 보여줍니다. (휠 더블클릭과 같음)": "Fit the whole drawing to the screen. (Same as double-clicking the wheel)",
  "방금 한 작업을 되돌립니다. (Ctrl+Z)": "Undo the last action. (Ctrl+Z)",
  "되돌린 작업을 다시 실행합니다. (Ctrl+Y)": "Redo an action you undid. (Ctrl+Y)",
  "밸브 · 구동부 · 계기 · 펌프 같은 공정 배관(P&ID) 기호를 그림 목록에서 골라 도면에 바로 넣습니다. 기호의 이름과 모양을 찾아보는 참고 자료로도 쓸 수 있습니다.": "Pick process piping (P&ID) symbols such as valves · actuators · instruments · pumps from a picture list and place them directly in the drawing. It also works as a reference for looking up symbol names and shapes.",
  "내가 그린 객체(설비 · 기호 · 표제란 · 자주 쓰는 부품 등)를 이름을 붙여 \"내 레퍼런스\"로 등록합니다. 등록한 것은 이 PC에 보관되어 어느 도면에서나 꺼내 쓸 수 있고, .rfdt 파일로 저장해 다른 PC나 동료에게 옮길 수 있습니다.": "Name the objects you drew (equipment · symbols · title blocks · frequently used parts, etc.) and register them as \"My References\". They are kept on this PC so you can use them in any drawing, and you can save them as an .rfdt file to move to another PC or share with colleagues.",
  "등록해 둔 내 레퍼런스 목록을 열어 도면에 넣거나, 지우거나, .rfdt 파일로 저장 · 불러오기를 합니다.": "Open your registered reference list to insert into the drawing, delete, or save / load as an .rfdt file.",
  "P&ID에서 계기와 밸브 · 제어기를 잇는 신호선을 그립니다. 종류별 표식이 자동으로 붙습니다: 공압(//) · 전기(점선) · 모세관(✕) · 유압(L) · 데이터 링크(○) · 기계적 연결(●).": "Draw signal lines that connect instruments with valves · controllers in a P&ID. Type marks are added automatically: pneumatic (//) · electrical (dashed) · capillary (✕) · hydraulic (L) · data link (○) · mechanical link (●).",
  "계기 기호(원 + 기능 문자 + 번호)를 한 번에 만듭니다. 예: PI-101, FIC-203. 현장 계기 · 제어실 계기 · 현장 패널 · DCS 화면 · PLC 모양을 고를 수 있고, 여러 개를 놓으면 번호가 1씩 늘어납니다.": "Create an instrument symbol (circle + function letters + number) in one step. Example: PI-101, FIC-203. You can choose field instrument · control room instrument · field panel · DCS display · PLC shape, and when you place several, the number increases by 1.",
  "배관 번호(라인 넘버)를 배관 선을 따라 그 위에 적습니다. 예: 4\"-P-1001-A1A (호칭경-유체-일련번호-배관등급).": "Write the line number along a pipe line, above it. Example: 4\"-P-1001-A1A (nominal size - fluid - serial number - piping class).",
  "서로 가로지르는 배관 · 신호선을 찾아, 연결되지 않았다는 뜻으로 한쪽 선을 끊거나(틈) 반원으로 넘겨 표시합니다. 굵은 선(주 배관)은 그대로 두고 가는 선을, 굵기가 같으면 세로 선을 끊습니다.": "Find pipes · signal lines that cross each other and mark them as not connected by breaking one line (gap) or bridging it with a half circle. The thick line (main pipe) is left as is and the thinner line is broken; if the thickness is the same, the vertical line is broken.",
  "A0~A4 · B1~B4 용지 크기의 도면 틀(테두리 · 중심 표시)과 표제란(도면명 · 도면 번호 · 축척 · 작성 · 검토 · 승인 · 날짜)을 도면 축척에 맞춰 그립니다.": "Draw a drawing frame (border · center marks) and title block (drawing name · drawing number · scale · drawn · checked · approved · date) for A0–A4 · B1–B4 paper at the drawing scale.",
  "이 도면에 실제로 쓰인 기호와 신호선 종류만 모아 범례 표를 자동으로 만듭니다.": "Automatically create a legend table with only the symbols and signal line types actually used in this drawing.",
  "도면의 계기 태그(PI-101 …)와 기호별 수량을 모아 일람표로 보여 줍니다. 도면에 표로 넣거나 엑셀용 CSV 파일로 저장할 수 있습니다.": "Collect the instrument tags (PI-101 …) and symbol quantities of the drawing into a list. You can insert it in the drawing as a table or save it as a CSV file for Excel.",
  "줄 · 칸 수를 정하고 칸마다 글자를 입력해 표를 만듭니다. 엑셀에서 복사한 내용을 그대로 붙여넣을 수 있고, 칸 너비는 글자 길이에 맞춰 자동으로 정해집니다. 설비 사양표 · 부품표 · 범례 · 개정 이력 등에 씁니다.": "Set the number of rows · columns and type text in each cell to create a table. You can paste content copied from Excel as is, and column widths are set automatically to fit the text. Use it for equipment spec tables · parts lists · legends · revision history, etc.",
  "배관이 어디서 오고 어디로 가는지 적는 오각형 표지(예: OIL OUTLET ▷)를 만듭니다. 글자 길이에 맞춰 상자 크기가 자동으로 정해집니다.": "Create a pentagonal tag (for example OIL OUTLET ▷) that says where a pipe comes from and goes to. The box size is set automatically to fit the text length.",
  "여러 객체를 왼쪽 · 가운데 · 오른쪽 · 위 · 아래로 가지런히 맞추거나, 사이 간격을 똑같이 만듭니다. (파워포인트의 \"맞춤\"과 같습니다)": "Align several objects neatly to the left · center · right · top · bottom, or make the spacing between them equal. (Same as \"Align\" in PowerPoint)",
  "여러 객체를 한 덩어리로 묶습니다. 묶은 것은 클릭 한 번에 함께 선택되고 함께 움직입니다. (Ctrl+G)": "Group several objects into one. A group is selected with one click and moves together. (Ctrl+G)",
  "묶은 그룹을 다시 낱개로 풉니다. (Ctrl+Shift+G)": "Break a group back into separate objects. (Ctrl+Shift+G)",
  "선택한 객체를 바로 옆에 하나 더 만듭니다. (Ctrl+D) 복제본이 선택된 상태이므로 끌거나 방향키로 자리를 잡으면 됩니다.": "Make one more copy of the selected objects right next to them. (Ctrl+D) The copy is left selected, so drag it or use the arrow keys to put it in place.",
  "흐름 방향 · 설명용으로 쓰는 속이 빈(또는 채운) 큰 화살표를 그립니다. 두 점을 찍어 길이와 방향을 정합니다.": "Draw a large hollow (or filled) arrow used for flow direction · explanation. Click two points to set the length and direction.",
  "도면 축척 · 치수 글자 높이 · 소수 자릿수 · 글꼴을 한 창에서 정합니다. 이미 그린 치수에도 한꺼번에 적용할 수 있습니다.": "Set the drawing scale · dimension text height · decimal places · font in one window. You can also apply them to dimensions already drawn, all at once.",
  "연습용 예제 도면(브래킷 부품도)을 엽니다. 마음껏 고쳐 보며 도구를 익힐 수 있습니다.": "Open a practice sample drawing (bracket part drawing). Feel free to edit it and get used to the tools.",
  "처음 실행했을 때 나오는 안내 창을 다시 엽니다.": "Reopen the guide window that appears the first time you run the program.",
  "원 · 마름모 · 사각형 · 육각형 안에 번호를 넣은 표시를 만듭니다. 공정흐름도(PFD)의 흐름 번호, 부품 번호, 개정 표시에 씁니다. 놓을 때마다 번호가 1씩 늘어납니다.": "Create a mark with a number inside a circle · diamond · rectangle · hexagon. Use it for flow numbers on a process flow diagram (PFD), part numbers and revision marks. The number increases by 1 each time you place one.",
  "도면 바탕을 검은색 ↔ 흰색으로 바꿉니다. 흰 바탕에서는 노랑·하늘색 같은 밝은 선이 잘 보이도록 자동으로 진하게 표시됩니다. 선택한 바탕은 다음 실행 때도 유지됩니다.": "Switch the drawing background between black and white. On a white background, light lines such as yellow and cyan are automatically shown darker so they stay visible. The chosen background is kept for the next run.",
  "① 시작 번호 · 모양(원 / 마름모 / 사각형 / 육각형) · 크기를 정하고 [도면에 놓기] → ② 놓을 자리를 차례로 클릭(1, 2, 3 … 자동 증가) → Enter로 끝. 공정흐름도의 물질수지표와 짝을 이루는 흐름 번호를 달 때 씁니다(표는 [표 만들기]).": "① Set the start number, shape (circle / diamond / square / hexagon) and size, then press [Place in drawing] → ② Click each spot in turn (numbers go up automatically: 1, 2, 3 …) → finish with Enter. Use it to add the stream numbers that pair with the material balance table on a process flow diagram (make the table with [Create table]).",
  "① 맞출 객체를 2개 이상 선택(간격 맞추기는 3개 이상) → [정렬 · 간격] → ② 그림 단추 중 하나를 누름: 왼쪽 / 가로 가운데 / 오른쪽 / 위 / 세로 가운데 / 아래 맞춤, 가로 간격 같게 / 세로 간격 같게. 기준은 선택한 것들 전체의 테두리입니다.": "① Select 2 or more objects (3 or more for equal spacing) → [Align · Space] → ② Press one of the picture buttons: align Left / Horizontal center / Right / Top / Vertical center / Bottom, Equal horizontal spacing / Equal vertical spacing. The reference is the bounding box of everything you selected.",
  "① 묶을 객체들을 선택 → [그룹 묶기] 또는 Ctrl+G. 그룹 안의 글자를 고치려면 먼저 [그룹 풀기](Ctrl+Shift+G)를 하세요.": "① Select the objects to group → [Group] or Ctrl+G. To edit text inside a group, first [Ungroup] it (Ctrl+Shift+G).",
  "그룹을 선택하고 [그룹 풀기] 또는 Ctrl+Shift+G.": "Select the group and press [Ungroup] or Ctrl+Shift+G.",
  "객체를 선택하고 [복제] 또는 Ctrl+D. 오른쪽 아래로 조금 떨어진 곳에 복제본이 생기고 선택됩니다 → 끌거나 방향키(1mm, Shift = 10mm)로 자리를 잡습니다.": "Select an object and press [Duplicate] or Ctrl+D. A copy appears slightly down and to the right and is selected → position it by dragging or with the arrow keys (1mm, Shift = 10mm).",
  "① 몸통 두께 · 머리 폭 · 머리 길이 · 속 채우기를 정하고 [도면에 놓기] → ② 시작점 클릭 → ③ 끝점(뾰족한 쪽) 클릭. 계속 그릴 수 있고 Enter로 끝냅니다.": "① Set the body thickness, head width, head length and fill, then press [Place in drawing] → ② Click the start point → ③ Click the end point (the pointed side). You can keep drawing; finish with Enter.",
  "도면 축척(1:n) · 글자 높이(인쇄 기준 mm) · 소수 자릿수 · 글꼴을 정하고 [적용]. [이미 그린 치수에도 적용]을 고르면 도면의 모든 치수가 함께 바뀝니다.": "Set the drawing scale (1:n), text height (mm as printed), decimal places and font, then press [Apply]. If you choose [Apply to existing dimensions too], every dimension in the drawing changes together.",
  "① 작은 창에 간격(mm)을 입력(1 · 2 · 5 · 10 … 버튼) → [확인] → ② 평행 복사할 선 · 원 · 도형을 클릭 → ③ 복사할 쪽(안/밖, 위/아래)을 클릭. 계속 반복하고 [완료]로 끝냅니다.": "① Enter the distance (mm) in the small window (1 · 2 · 5 · 10 … buttons) → [OK] → ② Click the line, circle or shape to copy in parallel → ③ Click the side to copy to (inside/outside, above/below). Repeat as needed and finish with [Done].",
  "① 작은 창에 반지름(mm)을 입력 → [확인] → ② 모서리를 이루는 두 선을 차례로 클릭. 반지름 0 = 두 선을 뾰족하게 맞닿게 합니다.": "① Enter the radius (mm) in the small window → [OK] → ② Click the two lines that form the corner, one after the other. Radius 0 = the two lines meet at a sharp corner.",
  "① 작은 창에 두 선에서 각각 깎을 거리(mm)를 입력 → [확인] → ② 두 선을 차례로 클릭.": "① Enter the distance (mm) to cut from each of the two lines in the small window → [OK] → ② Click the two lines in turn.",
  "① [다각형]을 누르면 작은 창이 뜹니다 → ② 변의 수(삼각형 ~ 십이각형 버튼 또는 숫자)와 크기 기준([한 변의 길이] · [중심에서 꼭짓점까지] · [맞변 거리]), 크기(mm), 회전(°)을 입력 — 오른쪽 그림과 아래 환산값(한 변 · 꼭짓점 지름 · 맞변 거리)이 바로 바뀝니다 → ③ [도면에 놓기] 또는 Enter → ④ 도면에서 중심이 될 곳을 클릭(여러 번 가능) → Enter로 끝. 볼트 머리 · 너트는 [맞변 거리]로 넣으면 편합니다. 예전처럼 하려면 [마우스로 직접 그리기].": "① Press [Polygon] and a small window appears → ② Enter the number of sides (triangle ~ 12-gon buttons, or a number), the size basis ([Side length] · [Center to vertex] · [Across flats]), the size (mm) and the rotation (°) — the picture on the right and the converted values below (side · vertex diameter · across flats) update instantly → ③ [Place in drawing] or Enter → ④ Click where the center should go in the drawing (as many times as you like) → finish with Enter. For bolt heads and nuts, entering [Across flats] is convenient. To work the old way, use [Draw with mouse].",
  "① [타원]을 누르면 작은 창이 뜹니다 → ② 가로 지름 · 세로 지름(끝에서 끝까지, mm)과 회전(°)을 입력 — 오른쪽 그림이 바로 바뀝니다 → ③ [도면에 놓기] 또는 Enter → ④ 도면에서 중심이 될 곳을 클릭(여러 번 가능) → Enter로 끝. 예전처럼 하려면 [마우스로 직접 그리기].": "① Press [Ellipse] and a small window appears → ② Enter the horizontal diameter and vertical diameter (end to end, mm) and the rotation (°) — the picture on the right updates instantly → ③ [Place in drawing] or Enter → ④ Click where the center should go in the drawing (as many times as you like) → finish with Enter. To work the old way, use [Draw with mouse].",
  "① 표지에 적을 글자 입력 → ② 뾰족한 쪽(오른쪽 ▷ / 왼쪽 ◁) 선택 → ③ 배관이 닿는 쪽(납작한 쪽 / 뾰족한 끝) 선택 → ④ 배관의 끝점을 클릭. 상자 크기는 글자 길이에 맞춰 자동으로 정해지고, 글자는 더블클릭해 고칠 수 있습니다.": "① Type the text for the tag → ② Choose the pointed side (right ▷ / left ◁) → ③ Choose the side the piping connects to (flat side / pointed tip) → ④ Click the end point of the piping. The box size is set automatically to fit the text length, and you can double-click the text to edit it.",
  "① 돌릴 객체를 선택 → [회전] → ② 작은 창에 각도(°)를 입력하거나 ↺ 90° · ↻ 90° · 180° · 45° 같은 버튼을 누름 — 옆의 작은 \"F\" 글자가 돌아가는 모양을 미리 보여 줍니다 → ③ 중심점(가운데 · 모서리 · 변의 가운데 · 도면에서 직접 찍기)을 고르고 [적용] 또는 Enter. + 값은 왼쪽(반시계), − 값은 오른쪽(시계) 방향입니다. [원본은 두고 복사본을 만들기]를 켜면 원본이 남습니다. 예전처럼 마우스로 돌리려면 [마우스로 직접 돌리기]를 누르세요.": "① Select the objects to rotate → [Rotate] → ② Enter the angle (°) in the small window, or press buttons like ↺ 90° · ↻ 90° · 180° · 45° — the small \"F\" letter beside it previews the rotation → ③ Choose the center point (center · corner · middle of a side · pick in the drawing) and press [Apply] or Enter. A + value turns left (counter-clockwise), a − value turns right (clockwise). Turn on [Keep the original and make a copy] to leave the original in place. To rotate with the mouse as before, press [Rotate with mouse].",
  "① 크기를 바꿀 객체를 선택(표는 영역으로 전체 선택) → [크기 조절] → ② 작은 창에 % 숫자를 입력하거나 25% ~ 300% 버튼을 누름 — 지금 크기와 바뀔 크기(mm)가 바로 표시됩니다 → 문자만 선택했을 때는 창에 [가로 mm] · [세로(글자 높이) mm] 칸이 더 나타나, 문구의 실제 길이를 숫자로 정할 수 있습니다(%와 서로 맞물려 바뀝니다. [비율 유지]를 끄면 가로만 따로 조절) → ③ 기준점(제자리에 있을 점: 가운데 · 모서리 · 변의 가운데 · 도면에서 직접 찍기)을 고르고 [적용] 또는 Enter. [원본은 두고 복사본을 만들기]를 켜면 원본이 남습니다. 예전처럼 마우스로 조절하려면 [마우스로 직접 조절]을 누르세요.": "① Select the objects to resize (for a table, select all of it with a window) → [Scale] → ② Enter a % number in the small window or press the 25% ~ 300% buttons — the current size and the new size (mm) are shown instantly → When only text is selected, the window also shows [Width mm] · [Height (text height) mm] fields so you can set the actual length of the text numerically (they change together with %; turn off [Keep proportions] to adjust only the width) → ③ Choose the base point (the point that stays in place: center · corner · middle of a side · pick in the drawing) and press [Apply] or Enter. Turn on [Keep the original and make a copy] to leave the original in place. To scale with the mouse as before, press [Scale with mouse].",
  "① 줄 수 · 칸 수를 정하고 → ② 칸을 눌러 글자를 입력(Tab = 다음 칸, Enter = 아래 칸). 엑셀에서 범위를 복사한 뒤 표의 아무 칸에서 Ctrl+V를 누르면 그 칸부터 한꺼번에 채워지고 줄 · 칸이 모자라면 자동으로 늘어납니다. 한 칸에 여러 줄을 쓰려면 \\n 을 넣습니다. [칸 합치기]: 첫 칸을 클릭하고 Shift를 누른 채 마지막 칸을 클릭해 범위를 고른 뒤 누릅니다. [칸 나누기 (좌우/상하)]: 고른 칸 하나만 둘로 나누며, 합친 칸에서 누르면 합치기가 풀립니다 → ③ 글자 높이 · 줄 높이 · 최소 칸 너비(mm, 인쇄 기준) · 정렬 · [첫 줄을 제목으로] · [칸 너비 자동 맞춤]을 고르고 → ④ [도면에 넣기] → 표의 왼쪽 위 구석을 클릭. 표는 선과 문자로 만들어지므로 글자는 더블클릭으로, 선은 보통 객체처럼 고칩니다. 선은 현재 레이어에, 글자는 \"문자\" 레이어에 들어갑니다.": "① Set the number of rows and columns → ② Click a cell and type text (Tab = next cell, Enter = cell below). If you copy a range from Excel and press Ctrl+V in any cell of the table, it fills in everything from that cell, and rows/columns are added automatically if there are too few. To write several lines in one cell, insert \\n. [Merge cells]: click the first cell, hold Shift and click the last cell to select the range, then press it. [Split cell (left-right/top-bottom)]: splits only one selected cell in two; pressing it on a merged cell undoes the merge → ③ Choose the text height · row height · minimum column width (mm, as printed) · alignment · [First row as title] · [Auto-fit column width] → ④ [Insert in drawing] → click the top-left corner of the table. A table is made of lines and text, so edit text by double-clicking and lines like ordinary objects. Lines go on the current layer, and text goes on the \"Text\" layer.",
  "① 교차 표시를 할 선들을 선택(그냥 Enter를 누르면 도면의 모든 선) → ② [끊기(틈)] 또는 [반원으로 넘기기] 선택. 끝이 맞닿은 곳(T자 연결 · 모서리)은 연결된 것으로 보고 건드리지 않습니다. 배관을 다 그린 뒤 마지막에 한 번 실행하는 것이 좋습니다.": "① Select the lines to mark crossings on (just press Enter to use every line in the drawing) → ② Choose [Break (gap)] or [Hop over with a half-circle]. Places where ends meet (T-junctions · corners) are treated as connected and are left alone. It is best to run this once at the very end, after all piping is drawn.",
  "① 용지(A3 등)와 방향 선택 → ② 도면명 · 도면 번호 · 작성자 입력 → ③ 틀의 왼쪽 아래 구석을 클릭(Enter = 원점). 도면 축척(오른쪽 \"도면 축척 1:n\")에 맞춰 크기가 정해지므로, 인쇄할 때 같은 용지와 같은 축척을 고르면 종이에 꼭 맞습니다. 표제란 글자는 더블클릭해 고칩니다.": "① Choose the paper (A3 etc.) and orientation → ② Enter the drawing name · drawing number · author → ③ Click the bottom-left corner of the frame (Enter = origin). The size follows the drawing scale (\"Drawing scale 1:n\" on the right), so when you print, choosing the same paper and the same scale makes it fit the sheet exactly. Double-click the title block text to edit it.",
  "버튼을 누르고 범례 표를 놓을 위치(왼쪽 위 구석)를 클릭합니다. 도면에 쓰인 기호 · 신호선만 자동으로 모입니다.": "Press the button and click where to place the legend table (its top-left corner). Only the symbols and signal lines actually used in the drawing are collected automatically.",
  "버튼을 누르면 계기 일람표와 기호 수량표가 창으로 나옵니다. [도면에 표로 넣기]는 놓을 위치를 클릭, [CSV 저장]은 엑셀에서 열 수 있는 파일로 저장합니다. 계기 태그의 글자를 더블클릭해 고쳤어도 고친 내용대로 모입니다.": "Press the button and the instrument list and symbol quantity table appear in a window. [Insert as table in drawing]: click where to place it. [Save CSV]: saves a file you can open in Excel. Even if you edited an instrument tag by double-clicking its text, the list is collected with your edited content.",
  "① 종류 선택(공압 · 전기 · 모세관 · 유압 · 데이터 링크 · 기계적 연결) → ② 시작점 클릭 → ③ 꺾이는 점들을 차례로 클릭 → ④ [완료]. [직교](F8)를 켜면 가로 · 세로로 반듯하게 그려집니다. \"계장-신호선\" 레이어가 자동으로 만들어집니다.": "① Choose the type (pneumatic · electric · capillary · hydraulic · data link · mechanical link) → ② Click the start point → ③ Click the bend points in turn → ④ [Done]. With [Ortho] (F8) on, lines are drawn perfectly horizontal and vertical. The \"Instrument-Signal line\" layer is created automatically.",
  "① 기능 문자 입력(예: PIC) → ② 번호 입력(예: 101) → ③ 종류 선택(현장 / 제어실 / 현장 패널 / DCS / PLC) → ④ 놓을 위치를 클릭(계속 클릭하면 102, 103 … 으로 늘어남) → [완료]. 문자는 더블클릭해 고칠 수 있습니다. 기능 문자의 뜻은 [기호 넣기] 창의 [계기 문자표] 탭에 있습니다.": "① Enter the function letters (e.g. PIC) → ② Enter the number (e.g. 101) → ③ Choose the type (Field / Control room / Field panel / DCS / PLC) → ④ Click where to place it (keep clicking and the number increases: 102, 103 …) → [Done]. You can double-click the text to edit it. The meaning of function letters is in the [Instrument letter table] tab of the [Insert symbol] window.",
  "① 배관 번호 입력 → ② 배관 직선 위를 클릭하면 선의 방향을 따라 선 바로 위에 적힙니다. 여러 곳에 계속 적을 수 있고 [완료]로 끝냅니다.": "① Enter the piping number → ② Click on a straight pipe, and the number is written right above the line, following the line direction. You can keep adding it in many places; finish with [Done].",
  "① 등록할 객체 선택 → [선택 완료] → ② 이름 입력 → ③ 분류 이름 입력(없으면 Enter) → ④ 기준점 클릭(놓을 때 마우스에 붙는 점, Enter를 누르면 가운데). 객체를 먼저 선택해 두고 버튼을 눌러도 됩니다. 쓰인 레이어 · 색 · 선 모양 · 블록도 함께 보관됩니다.": "① Select the objects to register → [Finish selection] → ② Enter a name → ③ Enter a category name (press Enter if none) → ④ Click the base point (the point that sticks to the mouse when placing; press Enter for the center). You can also select the objects first and then press the button. The layers · colors · linetypes · blocks used are stored along with them.",
  "목록에서 그림을 클릭 → 도면에서 놓을 위치 클릭(여러 번 가능) → [완료]. 등록한 실제 크기 그대로 들어가며 [90° 돌리기] · [크기]를 쓸 수 있습니다. 카드의 ✕는 삭제, [.rfdt로 저장]은 등록한 레퍼런스 전체를 파일 하나로 보관, [.rfdt 불러오기]는 파일의 레퍼런스를 목록에 더합니다(같은 것은 건너뜀). .rfdt 파일을 화면에 끌어다 놓아도 됩니다.": "Click a picture in the list → click where to place it in the drawing (as many times as you like) → [Done]. It goes in at the actual size it was registered at, and you can use [Rotate 90°] · [Size]. The ✕ on a card deletes it, [Save as .rfdt] stores all registered references in one file, and [Load .rfdt] adds the references in a file to the list (duplicates are skipped). You can also drag and drop an .rfdt file onto the screen.",
  "① 버튼을 누르면 기호 목록이 열립니다(이름으로 찾기 가능) → ② 기호 그림을 클릭 → ③ 도면에서 놓을 위치를 클릭. 배관으로 그린 직선 위를 클릭하면 선의 방향에 맞춰 돌아가고, 기호 폭만큼 선이 자동으로 끊어집니다. 계속 클릭해 여러 개를 놓고 [완료]. [90° 돌리기] · [크기] · [다른 기호] 버튼을 쓸 수 있습니다. 크기는 도면 축척(1:100 등)에 맞춰 자동으로 정해지며, 놓은 기호는 블록이므로 이동 · 회전 · 복사 · 대칭 복사가 되고 [낱개로 분해]로 풀어 고칠 수 있습니다.": "① Press the button and the symbol list opens (you can search by name) → ② Click a symbol picture → ③ Click where to place it in the drawing. If you click on a straight line drawn as piping, the symbol rotates to match the line direction and the line is cut automatically by the width of the symbol. Keep clicking to place several, then [Done]. You can use the [Rotate 90°] · [Size] · [Other symbol] buttons. The size is set automatically to match the drawing scale (1:100 etc.), and a placed symbol is a block, so it can be moved · rotated · copied · mirrored, and [Explode into pieces] lets you break it apart to edit.",
  "① 버튼을 누르고 JPG · PNG 그림 선택 (또는 그림을 복사 · 캡처한 뒤 Ctrl+V, 또는 파일을 화면에 끌어다 놓기) → ② [직접 따라 그리기] 또는 [자동 덧그리기(AI)] 선택 → ③ 직접: 아래 밑그림 막대의 [실제 길이 맞추기]로 크기를 맞춘 뒤 도구로 따라 그림 / 자동: AI가 선 · 원 · 호 · 치수 · 문자를 그리고, 그림에 적힌 치수 숫자로 실제 크기와 직선 길이 · 원 크기까지 정확히 맞춤 → ④ 다 그렸으면 [밑그림 제거].": "① Press the button and choose a JPG · PNG picture (or copy · capture a picture and press Ctrl+V, or drag and drop the file onto the screen) → ② Choose [Trace by hand] or [Auto trace (AI)] → ③ By hand: set the size with [Match real length] on the trace bar below, then trace with the tools / Auto: the AI draws lines · circles · arcs · dimensions · text and uses the dimension numbers written in the picture to match the real size, straight line lengths and circle sizes accurately → ④ When finished, [Remove trace].",
  "① Google AI Studio에서 발급받은 Gemini API 키를 붙여넣기 → ② [일주일간 저장] (키가 실제로 작동하는지 확인 후 이 PC에만 저장, 7일 뒤 자동 삭제) → 지우려면 [키 삭제].": "① Paste the Gemini API key issued from Google AI Studio → ② [Save for a week] (after checking that the key actually works, it is saved on this PC only and deleted automatically after 7 days) → to erase it, press [Delete key].",
  "버튼을 누르고 저장할 위치와 이름을 정합니다. 도면 전체가 흰 바탕 그림으로 저장됩니다.": "Press the button and choose where to save and the name. The whole drawing is saved as a picture on a white background.",
  "① 시작점 클릭 → ② 다음 점 클릭 (계속 찍으면 이어짐) → ③ [완료] 또는 Enter. 길이를 정하려면 마우스로 방향을 잡고 숫자 입력 후 Enter.": "① Click the start point → ② Click the next point (keep clicking to continue) → ③ [Done] or Enter. To set a length, aim with the mouse, type a number and press Enter.",
  "① 시작점 클릭 → ② 다음 점들을 차례로 클릭 → 둥글게 꺾으려면 [호], 다시 직선은 [선] → ③ [닫기]로 처음 점과 잇거나 [완료].": "① Click the start point → ② Click the next points in turn → for a rounded bend press [Arc], and [Line] to go straight again → ③ Join to the first point with [Close] or press [Done].",
  "① [원]을 누르면 작은 창이 뜹니다 → ② 크기 기준(지름 / 반지름)과 크기(mm)를 입력(5 · 10 · 20 … 버튼) → ③ [도면에 놓기] → ④ 도면에서 중심이 될 곳을 클릭(계속 클릭 = 같은 원 여러 개) → Enter로 끝. 세 점 · 두 점으로 그리려면 창의 [마우스로 직접 그리기]를 누른 뒤 [3점] / [2점].": "① Press [Circle] and a small window appears → ② Enter the size basis (diameter / radius) and the size (mm) (5 · 10 · 20 … buttons) → ③ [Place in drawing] → ④ Click where the center should go in the drawing (keep clicking = several of the same circle) → finish with Enter. To draw with three points or two points, press [Draw with mouse] in the window and then [3 points] / [2 points].",
  "① 시작점 → ② 호가 지나갈 중간 점 → ③ 끝점을 차례로 클릭. [중심]을 누르면 중심-시작-끝 순서로 그립니다.": "① Click the start point → ② a middle point the arc passes through → ③ the end point, in that order. Press [Center] to draw in the order center-start-end.",
  "① [사각형]을 누르면 작은 창이 뜹니다 → ② 가로 · 세로(mm), 모서리 둥글게(0 = 각진 모서리), 클릭할 곳(왼쪽 아래 구석 / 가운데 / 왼쪽 위 구석)을 정함 → ③ [도면에 놓기] → ④ 놓을 자리를 클릭. 두 구석을 찍어 그리려면 [마우스로 직접 그리기].": "① Press [Rectangle] and a small window appears → ② Set the width · height (mm), rounded corners (0 = sharp corners), and the click position (bottom-left corner / center / top-left corner) → ③ [Place in drawing] → ④ Click where to place it. To draw by picking two corners, use [Draw with mouse].",
  "점을 찍을 위치를 클릭합니다. 여러 개를 계속 찍을 수 있고 [완료]로 끝냅니다.": "Click where to place the point. You can keep placing several; finish with [Done].",
  "① 채울 도형(닫힌 사각형·원, 또는 끝이 맞닿은 선들)을 선택 → [선택 완료] → ② 무늬 [사선]/[격자]/[채움] 선택 → ③ 간격과 각도 입력.": "① Select the shape to fill (a closed rectangle or circle, or lines whose ends meet) → [Finish selection] → ② Choose the pattern [Diagonal] / [Grid] / [Solid] → ③ Enter the spacing and angle.",
  "① 옮길 객체 선택 → [이동] → ② 작은 창에 가로 · 세로 mm를 입력(예: 가로 50, 세로 −20) 하거나, 화살표 버튼(누를 때마다 [한 번에] 값만큼), 또는 거리 + 각도를 입력 — 어느 쪽으로 얼마나 가는지 글로 바로 보여 줍니다 → ③ [적용] 또는 Enter. [원본은 두고 복사본을 만들기]를 켜면 복사가 됩니다. 다른 도형의 끝점에 정확히 붙이려면 [마우스로 직접 옮기기](기준점 → 옮길 위치, 자석 작동)를 누르거나, 창 없이 객체를 마우스로 누른 채 끌어도 됩니다.": "① Select the objects to move → [Move] → ② In the small window, enter horizontal · vertical mm (e.g. horizontal 50, vertical −20), or use the arrow buttons (each press moves by the [Step] value), or enter distance + angle — a text line shows right away which way and how far it goes → ③ [Apply] or Enter. Turn on [Keep the original and make a copy] to make a copy instead. To attach exactly to the endpoint of another shape, press [Move with mouse] (base point → destination, magnet active), or just press and drag the object with the mouse without any window.",
  "① 복사할 객체 선택 → [선택 완료] → ② 기준점 클릭 → ③ 붙일 위치를 원하는 만큼 클릭 → [완료].": "① Select the objects to copy → [Finish selection] → ② Click the base point → ③ Click the places to paste as many times as you want → [Done].",
  "① 객체 선택 → ② 대칭선의 첫 점 → ③ 둘째 점 클릭 → ④ 원본을 지울지 [예]/[아니오].": "① Select the objects → ② Click the first point of the mirror line → ③ Click the second point → ④ Choose whether to delete the original: [Yes]/[No].",
  "① 늘일 부분을 영역(구석 두 번 클릭)으로 감쌈 → ② 기준점 클릭 → ③ 늘일 위치 클릭 또는 거리 입력. 영역 안의 끝점만 움직입니다.": "① Surround the part to stretch with a window (click two corners) → ② Click the base point → ③ Click the place to stretch to, or enter a distance. Only the endpoints inside the window move.",
  "① 객체 선택 → [배열 복사] → ② 작은 창에서 모양을 고름 — [바둑판]: 가로 · 세로 개수와 간격(− 값 = 왼쪽 · 아래로) / [원형]: 개수(원본 포함)와 채울 각도 → ③ [적용]. 원형은 이어서 도면에서 중심점을 클릭합니다.": "① Select the objects → [Array] → ② Choose the pattern in the small window — [Rectangular]: number of columns · rows and spacing (− value = to the left · downward) / [Circular]: number of items (including the original) and the angle to fill → ③ [Apply]. For circular, you then click the center point in the drawing.",
  "도구를 누른 뒤, 다른 선과 교차한 객체에서 없앨 부분을 클릭합니다. 계속 클릭할 수 있고 [완료]로 끝냅니다.": "After pressing the tool, click the part you want to remove from an object that crosses another line. You can keep clicking; finish with [Done].",
  "도구를 누른 뒤, 늘리고 싶은 선의 끝 근처를 클릭하면 가장 가까운 경계까지 늘어납니다.": "After pressing the tool, click near the end of the line you want to lengthen and it extends to the nearest boundary.",
  "끝이 서로 맞닿은 선·호들을 선택 → [선택 완료]. 하나의 이어진 선이 되어 평행 복사·빗금 채우기가 쉬워집니다.": "Select lines · arcs whose ends meet → [Finish selection]. They become a single connected line, which makes parallel copy · hatch fill easier.",
  "분해할 블록·이어진 선·치수를 선택 → [선택 완료].": "Select the blocks · connected lines · dimensions to explode → [Finish selection].",
  "① 본보기 객체 클릭 → ② 바꿀 객체들 선택 → [선택 완료].": "① Click the source object → ② Select the objects to change → [Finish selection].",
  "지울 객체 선택 → [선택 완료]. (먼저 선택하고 Delete 키를 눌러도 됩니다)": "Select the objects to erase → [Finish selection]. (You can also select first and press the Delete key.)",
  "① 글자 시작 위치 클릭 → ② 글자 높이 입력 → ③ 회전 각도 (보통 0) → ④ 아래 입력창에 글을 쓰고 Enter. 빈 줄에서 Enter로 끝냅니다.": "① Click the text start position → ② Enter the text height → ③ Rotation angle (usually 0) → ④ Type the text in the command box below and press Enter. Finish by pressing Enter on an empty line.",
  "고칠 문자나 치수를 클릭 → 아래 입력창에 새 내용을 쓰고 Enter. 치수에서 <> 는 자동 측정값을 뜻합니다 (예: <> ±0.1).": "Click the text or dimension to edit → type the new content in the command box below and press Enter. In a dimension, <> stands for the automatic measured value (e.g. <> ±0.1).",
  "① 화살표 끝 위치 클릭 → ② 꺾이는 점 클릭 → [완료] → ③ 설명 글 입력 후 Enter.": "① Click the arrow tip position → ② Click the bend point → [Done] → ③ Type the note text and press Enter.",
  "① 재려는 첫 점 클릭 → ② 둘째 점 클릭 → ③ 치수선을 놓을 위치 클릭. 마우스를 위·아래로 빼면 가로 치수, 좌·우로 빼면 세로 치수.": "① Click the first point to measure → ② Click the second point → ③ Click where to place the dimension line. Pulling the mouse up or down gives a horizontal dimension; pulling it left or right gives a vertical dimension.",
  "① 첫 점 → ② 둘째 점 → ③ 치수선 위치 클릭. 두 점을 잇는 방향 그대로 실제 길이를 표시합니다.": "① First point → ② Second point → ③ Click the dimension line position. It shows the actual length along the direction connecting the two points.",
  "① 원 또는 호 클릭 → ② 치수 글자를 놓을 위치 클릭. R 기호가 자동으로 붙습니다.": "① Click a circle or arc → ② Click where to place the dimension text. The R symbol is added automatically.",
  "① 원 클릭 → ② 치수 글자를 놓을 위치 클릭. Ø 기호가 자동으로 붙습니다.": "① Click a circle → ② Click where to place the dimension text. The Ø symbol is added automatically.",
  "① 첫 번째 선 클릭 → ② 두 번째 선 클릭 → ③ 각도 표시를 놓을 위치 클릭.": "① Click the first line → ② Click the second line → ③ Click where to place the angle mark.",
  "원이나 호를 선택 → [선택 완료]. 빨간 일점쇄선 십자 중심선이 \"중심선\" 레이어에 그려집니다.": "Select a circle or arc → [Finish selection]. Red dash-dot cross centerlines are drawn on the \"Centerline\" layer.",
  "① [Windows 글꼴 전체 불러오기] 클릭 (브라우저가 물으면 허용) → ② 검색·미리보기로 고른 글꼴의 [등록] 클릭 → ③ 위쪽 등록 목록에서 글꼴을 클릭하면 현재 글꼴로 지정.": "① Click [Load all Windows fonts] (allow it if the browser asks) → ② Click [Register] on the font you picked using search · preview → ③ Click a font in the registered list at the top to set it as the current font.",
  "① 묶을 객체 선택 → ② 블록 이름 입력 → ③ 삽입 기준점 클릭.": "① Select the objects to group → ② Enter the block name → ③ Click the insertion base point.",
  "① 블록 이름 입력 → ② 놓을 위치 클릭 → ③ 배율 (보통 1) → ④ 회전 각도 (보통 0).": "① Enter the block name → ② Click where to place it → ③ Scale (usually 1) → ④ Rotation angle (usually 0).",
  "① 첫 점 클릭 → ② 둘째 점 클릭. 결과(거리·각도·가로/세로 차이)는 아래 기록창에 나옵니다.": "① Click the first point → ② Click the second point. The result (distance · angle · horizontal/vertical difference) appears in the log box below.",
  "면적을 잴 모서리들을 차례로 클릭 → [완료]. [객체]를 누르면 원·닫힌 도형을 클릭해 바로 잽니다. 결과는 mm²와 m²로 나옵니다.": "Click the corners of the area to measure in order → [Done]. Press [Object] to click a circle or closed shape and measure it directly. The result is given in mm² and m².",
  "객체 선택 → [선택 완료]. 길이·반지름·면적 등이 아래 기록창에 나옵니다.": "Select objects → [Finish selection]. Length · radius · area and so on appear in the log box below.",
  "[기계 부품도] 또는 [공장·공정시설]을 고르면 용도에 맞는 레이어와 도면 축척이 한 번에 준비됩니다.": "Choose [Mechanical part drawing] or [Plant · process facility] and the layers and drawing scale suited to that use are prepared in one step.",
  "① 용지(A0~A4, B1~B4)와 방향 선택 → ② 축척: [용지에 맞춤] 또는 1:n 지정 → ③ [인쇄 미리보기 열기] → 프린터를 고르거나 \"PDF로 저장\".": "① Choose the paper (A0~A4, B1~B4) and orientation → ② Scale: [Fit to paper] or specify 1:n → ③ [Open print preview] → choose a printer or \"Save as PDF\".",
  "① 형식 선택 (MCD · DXF · PDF · PNG · PNG 투명 · JPG · SVG) → ② DXF면 버전(AutoCAD 2000 권장 / 오래된 CAD용 R12) 선택 → ② PDF · 그림이면 용지(A0~A4, B1~B4 / 그림은 \"용지 없음\"도 가능) · 방향 · 출력 영역 · 축척(용지에 맞춤 또는 1:n) · 해상도 선택 → ③ [저장]을 누르고 저장할 위치와 이름 지정.": "① Choose the format (MCD · DXF · PDF · PNG · PNG transparent · JPG · SVG) → ② For DXF, choose the version (AutoCAD 2000 recommended / R12 for old CAD) → ② For PDF · images, choose the paper (A0~A4, B1~B4 / for images \"No paper\" is also possible) · orientation · output area · scale (fit to paper or 1:n) · resolution → ③ Press [Save] and set where to save and the name.",
  "파일 선택 창에서 .mcd · .dwg · .dxf 파일을 고릅니다. 파일을 도면 화면으로 끌어다 놓아도 열립니다.": "In the file chooser, pick a .mcd · .dwg · .dxf file. You can also open a file by dragging and dropping it onto the drawing screen.",
  "처음에는 저장 위치와 이름을 묻고, 그 다음부터는 같은 파일에 바로 덮어씁니다. (Ctrl+S)": "The first time it asks for a save location and name; after that it overwrites the same file directly. (Ctrl+S)",
  "저장 위치를 고르면 현재 활성 도면이 DXF(R12) 파일로 만들어집니다. 오토캐드에서 열 수 있습니다.": "Choose a save location and the current active drawing is made into a DXF (R12) file. You can open it in AutoCAD.",
  "처음 시작하기": "Getting started",
  "1. 도구 고르기": "1. Pick a tool",
  "위쪽 탭(홈 · 그리기 · 고치기 …)에서 큰 버튼을 누릅니다. 처음에는 [홈] 탭만으로 충분합니다.": "Press a large button in the tabs at the top (Home · Draw · Modify …). To begin with, the [Home] tab alone is enough.",
  "2. 안내 막대 따라 하기": "2. Follow the guide bar",
  "도면 위쪽 가운데에 \"지금 할 일\"이 노란 글씨로 나옵니다. 그대로 화면을 클릭하거나, 막대 안의 버튼을 누르거나, 아래 입력창에 숫자를 넣으면 됩니다.": "What to do now appears in yellow text at the top center of the drawing. Just click the screen, press a button in the bar, or type a number in the command box below.",
  "3. 끝내기 · 그만두기": "3. Finishing · quitting",
  "초록색 [완료] 버튼 또는 Enter / 마우스 오른쪽 버튼으로 끝내고, [취소] 버튼 또는 Esc 키로 그만둡니다.": "Finish with the green [Done] button, Enter, or the right mouse button; quit with the [Cancel] button or the Esc key.",
  "4. 고치기": "4. Editing",
  "이미 그린 객체를 클릭하면 파랗게 선택되고, 안내 막대에 [이동][복사][회전][지우기] 버튼이 바로 나타납니다. 파란 네모(그립)를 클릭하면 그 점만 끌어 옮길 수 있습니다.": "Click an object you have already drawn and it turns blue (selected), and [Move][Copy][Rotate][Erase] buttons appear right in the guide bar. Click a blue square (grip) to drag just that point.",
  "4-1. 끌어서 옮기기 (자석)": "4-1. Drag to move (magnet)",
  "객체를 마우스 왼쪽 버튼으로 누른 채 끌면 파워포인트처럼 바로 옮겨집니다. 아래 상태 표시줄의 [🧲 자석] 단추(단축키 F9)가 켜져 있으면 옮기는 도형의 끝점 · 중간점 · 중심이 다른 도형의 끝점 · 선에 가까워질 때 분홍색 기호가 나타나며 오차 없이 정확히 붙습니다. 버튼에서 손을 떼면 확정, Esc는 취소, Shift를 누르면 가로 · 세로로만 움직입니다.": "Press and hold the left mouse button on an object and drag it, and it moves immediately, like in PowerPoint. When the [🧲 Magnet] button in the status bar below (shortcut F9) is on, a pink symbol appears as the endpoint · midpoint · center of the moving shape nears an endpoint · line of another shape, and it snaps exactly with no error. Releasing the button confirms, Esc cancels, and holding Shift moves only horizontally · vertically.",
  "5. 실수했을 때": "5. When you make a mistake",
  "오른쪽 위 [되돌리기] 또는 Ctrl+Z. 되돌린 것을 다시 하려면 [다시 실행] 또는 Ctrl+Y.": "[Undo] at the top right or Ctrl+Z. To redo what you undid, [Redo] or Ctrl+Y.",

  "마우스가 가리키는 방향으로 그 길이만큼. [직교](F8)를 켜 두면 가로·세로로 정확히 그려집니다. 가장 많이 쓰는 방법입니다.": "That length in the direction the mouse is pointing. With [Ortho] (F8) on, it is drawn exactly horizontal · vertical. This is the most commonly used method.",
  "100,50": "100,50",
  "첫 점에서는 도면의 절대 위치(X=100, Y=50). 두 번째 점부터는 앞 점에서 가로 100, 세로 50만큼 떨어진 곳.": "For the first point, the absolute position in the drawing (X=100, Y=50). From the second point on, a spot 100 across and 50 up from the previous point.",

  "항상 도면의 절대 위치": "Always the absolute position in the drawing",

  "100<45": "100<45",
  "앞 점에서 거리 100, 각도 45° 방향 (각도는 오른쪽이 0°, 반시계 방향이 +)": "Distance 100 from the previous point at an angle of 45° (angles are 0° to the right, + counter-clockwise)",
  "단위": "Units",
  "도면의 1은 1mm입니다. 공장 도면도 실제 크기(mm) 그대로 그리고, 오른쪽 \"도면 축척\"과 인쇄 축척으로 조절합니다.": "In the drawing, 1 equals 1mm. Even plant drawings are drawn at actual size (mm), and adjusted with the \"Drawing scale\" on the right and the print scale.",
  "안내 막대 (도면 위쪽 가운데)": "Guide bar (top center of the drawing)",
  "노란 글씨": "Yellow text",
  "지금 해야 할 일. 그 아래 회색 글씨는 입력 방법입니다.": "What you need to do now. The gray text below it explains how to enter it.",
  "회색 옵션 버튼 (예: 지름 · 닫기 · 복사 · 반지름)": "Gray option buttons (e.g. Diameter · Close · Copy · Radius)",
  "이 단계에서 고를 수 있는 다른 방법. 누르면 바로 적용됩니다.": "Other ways you can choose at this step. Pressing one applies it right away.",

  "지난번에 쓴 값을 그대로 다시 씁니다.": "Reuse the value you used last time as is.",
  "초록 [완료] / [선택 완료]": "Green [Done] / [Finish selection]",
  "이 단계를 끝냅니다. 단축키: Enter · Space(스페이스바) · 마우스 오른쪽 클릭 (문자를 쓰는 중에는 Space가 띄어쓰기이므로 Enter)": "Ends this step. Shortcuts: Enter · Space (spacebar) · right mouse click (while typing text, Space is a space character, so use Enter)",

  "단추 안의 작은 글자 (Enter · Esc · C · M …)": "Small letters inside a button (Enter · Esc · C · M …)",
  "그 단추의 단축키입니다. 글자 단축키는 아래 입력창에 그 글자를 치고 Enter를 누르면 됩니다.": "The shortcut for that button. For letter shortcuts, type that letter in the command box below and press Enter.",
  "객체를 선택했을 때": "When an object is selected",
  "[이동][복사][회전][대칭 복사][크기 조절][배열 복사][지우기][선택 해제] 버튼이 나타납니다.": "The [Move][Copy][Rotate][Mirror][Scale][Array][Erase][Deselect] buttons appear.",
  "밑그림 막대 (흉내그리기를 할 때 도면 아래쪽에 나타남)": "Trace bar (appears at the bottom of the drawing when tracing)",
  "투명도 · 크기": "Opacity · Size",
  "밑그림을 더 흐리게/진하게, 더 크게/작게 조절합니다.": "Make the trace fainter/darker, larger/smaller.",
  "📏 실제 길이 맞추기": "📏 Match real length",
  "밑그림에서 길이를 아는 부분의 두 점을 찍고 실제 길이(mm)를 입력하면 밑그림이 실제 크기가 됩니다. 그 뒤에 따라 그리면 치수가 실제 값으로 나옵니다.": "Pick two points on the trace where you know the length and enter the real length (mm), and the trace becomes real size. If you then trace over it, dimensions come out as real values.",
  "✥ 위치 이동": "✥ Move position",
  "밑그림을 다른 위치로 옮깁니다.": "Move the trace to another position.",
  "⚡ 자동 (AI 없이)": "⚡ Auto (no AI)",
  "이 프로그램이 직접 밑그림에서 선 · 원 · 호 · 점선을 찾아 그립니다. 인터넷과 API 키가 필요 없고 그림이 밖으로 전송되지 않습니다. 바탕색(흰 바탕 · 검은 바탕)과 선 색을 자동으로 가려내고, 글자처럼 보이는 작은 모양은 빼며, 갈림점에서 끊긴 직선을 다시 한 줄로 잇고, 수평 · 수직 펴기와 자석 맞춤까지 합니다. 글자 · 치수 숫자는 읽지 못합니다 — 선명한 캡처 · 스캔 · CAD 출력 그림에서 가장 잘 됩니다.": "This program itself finds lines · circles · arcs · dashed lines in the trace and draws them. No internet or API key is needed, and the picture is not sent anywhere. It automatically tells the background color (white background · black background) and line colors apart, leaves out small shapes that look like text, rejoins straight lines broken at junctions into one line, and even straightens to horizontal · vertical and snaps with the magnet. It cannot read text · dimension numbers — it works best on clear captures · scans · CAD output pictures.",
  "방법 선택": "Choose method",
  "따라 그리는 방법을 다시 고릅니다. 자동(AI)은 [AI설정]에 키가 등록되어 있어야 합니다. AI가 그린 뒤에는 [자석 맞춤]이 자동으로 실행되어 맞닿는 끝점 · 선 위에 닿는 끝 · 둥근 모서리를 오차 없이 붙이고, 기록창에 몇 곳을 맞췄는지 알려 줍니다.": "Pick the tracing method again. Auto (AI) requires a key registered in [AI Settings]. After the AI draws, [Magnet fit] runs automatically and joins touching endpoints · ends that reach onto a line · rounded corners with no error, and the log box tells you how many places were fitted.",
  "밑그림 제거": "Remove trace",
  "밑그림만 지웁니다. 그린 도면은 그대로 남습니다. 밑그림은 도면 파일에 저장되지 않습니다.": "Removes only the trace. The drawing you made stays as it is. The trace is not saved in the drawing file.",
  "도면 겹치기 탭 (도구 아래 줄)": "Sheet overlay tabs (row below the tools)",
  "도면 이름 탭": "Drawing name tab",
  "클릭하면 그 도면이 활성(편집 대상)이 됩니다. 나머지는 밑그림으로 흐리게 보이며 스냅은 걸립니다. 더블클릭하면 이름을 바꿉니다.": "Click it and that drawing becomes active (the one being edited). The others appear faded as an underlay, and snaps still work. Double-click to rename.",

  "◐ / ●": "◐ / ●",
  "밑그림일 때 흐리게 / 진하게 표시": "Show faded / solid when it is an underlay",

  "＋ 파일 겹치기": "＋ Overlay file",
  "DWG · DXF · MCD 파일을 불러와 현재 작업 위에 겹칩니다. 건축 도면 위에 설비 · 배관 도면을 겹쳐 볼 때 씁니다.": "Load a DWG · DXF · MCD file and overlay it on the current work. Use it to view equipment · piping drawings overlaid on an architectural drawing.",

  "도면 축척 1:n": "Drawing scale 1:n",
  "기계 부품도는 1, 공장 배치도는 100 처럼 맞추면 치수 화살표 · 문자 크기 · 점선 간격이 출력 기준으로 자동 조정됩니다.": "Set it to 1 for mechanical part drawings and 100 for plant layouts, and dimension arrows · text size · dash spacing adjust automatically to the output scale.",
  "레이어 (객체를 선택했을 때)": "Layer (when an object is selected)",
  "선택한 객체만 다른 레이어로 옮깁니다. 같은 레이어에 있는 여러 객체 중 일부만 골라(클릭 또는 영역 선택) 목록에서 레이어를 고르면 됩니다. 목록 맨 아래 [＋ 새 레이어 만들어 옮기기…]를 고르면 이름을 묻고 새 레이어를 만들어 바로 옮깁니다(색 · 선 모양은 원래 레이어와 같게 시작).": "Moves only the selected objects to another layer. Pick just some of several objects on the same layer (by clicking or window selection) and choose a layer from the list. If you choose [＋ Create new layer and move…] at the bottom of the list, it asks for a name, creates the new layer and moves them right away (the color · linetype start the same as the original layer).",
  "파선 길이 · 파선 간격": "Dash length · Dash gap",

  "기록창 · 입력창": "Log box · Command box",
  "도구의 진행 기록과 측정 결과가 나오고, 숫자 · 좌표 · 글자를 입력합니다. 오토캐드처럼 L, C, M 같은 단축 명령을 직접 쳐도 됩니다. ↑ 키로 이전 입력을 불러옵니다.": "The tool progress log and measurement results appear here, and you type numbers · coordinates · text. Like AutoCAD, you can also type short commands such as L, C, M directly. The ↑ key recalls previous input.",
