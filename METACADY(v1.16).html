  "[다각형]: 변의 수(삼각형 ~ 십이각형 버튼) · 크기 기준(한 변의 길이 / 꼭짓점까지 / 맞변 거리) · 크기 · 회전을 한 창에서 숫자로 입력, 미리 보기와 환산값 표시. [타원]: 가로 지름 · 세로 지름 · 회전을 한 창에서 입력. 둘 다 도면에서는 놓을 자리(중심)만 클릭, 여러 개 연속 배치. 예전 방식은 [마우스로 직접 그리기]": "[Polygon]: enter number of sides (triangle ~ dodecagon buttons) · size basis (side length / to vertex / across flats) · size · rotation numerically in one window, with preview and converted values. [Ellipse]: enter horizontal diameter · vertical diameter · rotation in one window. For both, just click the placement point (center) in the drawing; multiple can be placed in succession. The old way is [Draw with mouse]",
  "입력 창 확대 적용": "Input boxes extended",
  "[원](지름 / 반지름) · [사각형](가로 × 세로 · 둥근 모서리 · 클릭 기준) · [문자 쓰기](여러 줄 내용 · 높이 · 맞춤 · 회전 · 글꼴) · [배열 복사](바둑판 / 원형) · [빗금 채우기] · [계기 태그] · [연결 표지] · [도면 틀 · 표제란]도 단추를 누르면 필요한 값을 한 창에서 입력": "[Circle] (diameter / radius) · [Rectangle] (width × height · rounded corners · click reference) · [Text] (multiline content · height · justification · rotation · font) · [Array] (grid / polar) · [Hatch] · [Instrument Tag] · [Connector Tag] · [Title Block] also take the values they need in one window when you click their buttons",
  "오토캐드 방식 유지": "AutoCAD-style input kept",
  "명령창에 직접 친 명령(L · C · M · POL …)은 언제나 예전의 질문 · 대답 방식 그대로. 상태 표시줄 [입력 창]을 끄면 단추도 예전 방식, 각 창의 [마우스로 직접 …] · [명령창에서 직접 입력]으로도 전환": "Commands typed directly in the command line (L · C · M · POL …) always use the classic question · answer style. Turning off [Input Box] in the status bar makes the buttons use the classic way too; you can also switch with [Use mouse directly …] · [Type in command line] in each window",
  "기본 기호 추가 (ISA S5.1 · ISO 14617-6)": "More built-in symbols (ISA S5.1 · ISO 14617-6)",
  "보온 · 재킷 · 트레이싱 배관, 플렉시블 연결, 유압 펌프, 팬, 건조기, 재킷 / 반관 코일 교반 용기, 충전탑 · 단탑, 가열로, 냉각탑, 코일 · 판형 · 이중관 · 직관식 · U자관 · 나선형 열교환기, 냉각기, 곡관 벤트, 필터, 깔때기, 원형 스팀 트랩, 뷰잉 글라스, 감압 밸브, 댐퍼, 상자형 버터플라이, 자루, 가스 용기 등 30종을 기본 레퍼런스로 내장 (기본 기호 110여 종)": "30 built-in references: insulated · jacketed · traced piping, flexible connection, hydraulic pump, fan, dryer, jacketed / half-pipe coil agitated vessel, packed tower · tray tower, fired heater, cooling tower, coil · plate · double-pipe · straight-tube · U-tube · spiral heat exchangers, cooler, pipe bend vent, filter, funnel, round steam trap, sight glass, pressure-reducing valve, damper, box butterfly, sack, gas cylinder, etc. (about 110 built-in symbols)",
  "입력 창 · 다각형 · 타원 · 원 · 사각형 · 문자 쓰기 창 설명과 [입력 창] 켜고 끄기 설명 추가": "Added descriptions of the input box · polygon · ellipse · circle · rectangle · text windows and of turning [Input Box] on and off",
  "이동 창": "Move window",
  "[이동]을 누르면 작은 창에서 가로 · 세로로 몇 mm 옮길지 숫자로 입력(+ 오른쪽 · 위 / − 왼쪽 · 아래), 화살표 버튼(한 번에 옮길 값 지정), 거리 + 각도 입력, 옮기는 방향 미리 보기, 복사본 만들기. 예전 방식은 [마우스로 직접 옮기기](자석 작동)": "Clicking [Move] opens a small window to enter how many mm to move horizontally · vertically (+ right · up / − left · down), arrow buttons (set the amount per click), distance + angle input, direction preview, and make copies. The old way is [Move with mouse] (magnet active)",
  "공정도 보완 (따라 그리기 시험에서 찾은 미흡점)": "Process diagram improvements (gaps found in redraw tests)",
  "연결 표지 도구(글자 길이에 맞춰 자동 크기의 오각형 표지 ▷ ◁), 계기 태그 글자가 원 밖으로 나가지 않게 폭 자동 맞춤, 문자 특성에 [폭 비율] 추가, 연결점(●) 기호 추가": "Connector tag tool (pentagon tag ▷ ◁ that auto-sizes to text length), instrument tag text auto-fits width so it doesn't spill outside the circle, [Width factor] added to text properties, connection dot (●) symbol added",
  "Windows 글꼴 전체 연동": "Full Windows font integration",
  "문자의 글꼴 목록에 ★ 등록한 글꼴 + 이 PC의 Windows 글꼴 전체가 나타남 — 목록의 [＋ Windows 글꼴 모두 불러오기…]를 한 번 허용하면 이후 자동 연동, 허용 전에도 흔한 글꼴 중 설치된 것을 자동 감지": "The text font list now shows ★ registered fonts + all Windows fonts on this PC — allow [＋ Load all Windows fonts…] in the list once and it syncs automatically afterwards; before permission, installed fonts among common ones are detected automatically",
  "자동 덧그리기 (AI 없이) 개선": "Auto-trace (no AI) improvements",
  "나란히 놓인 계기 원 · 상자가 글자 줄로 오인되어 사라지던 문제 수정(글자 높이를 어림해 그보다 훨씬 큰 것은 글자로 보지 않음)": "Fixed instrument circles · boxes placed side by side being mistaken for text lines and disappearing (text height is estimated, and things much larger than that are not treated as text)",
  "이동 창 · 연결 표지 · 글꼴 연동 설명 추가": "Added descriptions of the move window · connector tag · font integration",
  "자동 덧그리기 (AI 없이)": "Auto-trace (no AI)",
  "흉내그리기에 세 번째 방법 추가 — 이 프로그램이 직접 밑그림에서 선 · 원 · 호 · 점선을 찾아 그림(인터넷 · API 키 불필요, 그림이 밖으로 나가지 않음, 몇 초). 바탕색 · 선 색 자동 판별(검은 바탕 CAD 캡처 포함), 글자로 보이는 작은 모양 · 글자 줄 제외, 다른 선에 잘린 원 되살리기, 갈림점에서 끊긴 직선 다시 잇기, 점선 → 숨은선 · 중심선 묶기, 수평 · 수직 펴기와 자석 맞춤. 글자 · 치수 숫자는 읽지 못함": "Added a third method to Trace — this program finds lines · circles · arcs · dashed lines in the underlay by itself (no internet · API key needed, the image never leaves your PC, a few seconds). Auto-detects background · line colors (including black-background CAD captures), excludes small text-like shapes · text lines, restores circles cut by other lines, rejoins lines broken at branch points, merges dashes → hidden · center lines, straightens horizontal · vertical and magnet snapping. Text · dimension numbers cannot be read",
  "문자 크기 조절": "Text scaling",
  "[크기 조절]에서 문자만 선택하면 문구의 가로 · 세로(글자 높이) 길이를 mm로 직접 입력 가능 — %와 서로 맞물려 바뀌고, [비율 유지]를 끄면 가로만 따로 조절(글자 폭 비율)": "When only text is selected in [Scale], you can enter the text's width · height (letter height) directly in mm — linked with %, and with [Keep ratio] off, only the width is adjusted separately (character width ratio)",
  "화면 확대 · 축소 한계": "Zoom limits",
  "빈 도면에서 휠을 지나치게 돌려 수십억 mm 좌표에서 그리게 되는 일을 막음": "Prevents drawing at coordinates billions of mm out caused by spinning the wheel too far on an empty drawing",
  "회전 창": "Rotate window",
  "[회전]을 누르면 작은 창에서 몇 도 돌릴지 숫자로 입력(↺ 90° · ↻ 90° · 180° · 45° · 30° · 15° 빠른 버튼, 돌아가는 방향 미리 보기, 중심점 9곳 또는 직접 찍기, 복사본 만들기). 예전 방식은 [마우스로 직접 돌리기]": "Clicking [Rotate] opens a small window to enter degrees numerically (↺ 90° · ↻ 90° · 180° · 45° · 30° · 15° quick buttons, rotation direction preview, 9 center points or pick directly, make copies). The old way is [Rotate with mouse]",
  "표 글자 자동 맞춤": "Auto-fit table text",
  "표제란 · 일람표 · 범례 · 표의 글자가 칸보다 길면 칸 너비에 맞게 자동으로 줄임": "If text in title blocks · schedules · legends · tables is longer than the cell, it is automatically shrunk to fit the cell width",
  "자동 덧그리기(AI 없이) · 회전 창 · 문자 크기 mm 입력 설명 추가": "Added descriptions of auto-trace (no AI) · rotate window · text size mm input",
  "줄 · 칸 수를 정해 칸마다 입력하는 [표 만들기] 도구 — 엑셀에서 복사한 범위 붙여넣기(줄 · 칸 자동 늘림), 칸 합치기(Shift+클릭으로 범위 선택) · 칸 나누기(좌우 / 상하, 합친 칸은 풀기), 칸 너비 자동 맞춤, 여러 줄 칸, 첫 줄 제목, 정렬, 글자 · 줄 높이(mm, 도면 축척 반영)": "A [Table] tool where you set rows · columns and type into each cell — paste ranges copied from Excel (rows · columns grow automatically), merge cells (select a range with Shift+click) · split cells (left-right / top-bottom, unmerge merged cells), auto-fit column width, multiline cells, first-row header, alignment, text · row height (mm, reflects drawing scale)",
  "흉내그리기 자석 맞춤": "Trace magnet snapping",
  "AI가 덧그린 결과를 사람이 객체 스냅으로 그린 것처럼 후처리 — 가까운 끝점끼리 한 점으로(직선은 방향을 지키며 교점으로), 다른 선 · 원 위에서 끝나는 선은 그 위까지 정확히 늘이거나 줄임, 가로 · 세로선을 잇는 1/4 원호는 정확히 접하는 둥근 모서리로, 중심이 같은 원 · 크기가 같은 원 맞춤. AI 지시문에도 \"맞닿는 끝점은 같은 좌표\"를 강하게 요구": "Post-processes AI-traced results as if a person drew them with object snaps — nearby endpoints merged into one point (lines meet at their intersection while keeping direction), lines ending on other lines · circles extended or trimmed exactly onto them, quarter arcs joining horizontal · vertical lines turned into exactly tangent fillets, concentric circles · equal-size circles matched. The AI prompt also strongly requires \"touching endpoints share the same coordinates\"",
  "크기 조절 창": "Scale window",
  "[크기 조절]을 누르면 작은 창에서 몇 %로 할지 숫자로 입력(25% ~ 300% 빠른 버튼, 지금 크기 → 바뀔 크기 mm 표시, 기준점 9곳 또는 직접 찍기, 복사본 만들기). 예전 방식은 [마우스로 직접 조절]": "Clicking [Scale] opens a small window to enter the percentage numerically (25% ~ 300% quick buttons, shows current size → new size in mm, 9 base points or pick directly, make copies). The old way is [Scale with mouse]",
  "표 만들기(합치기 · 나누기) · 크기 조절 창 · 흉내그리기 자석 맞춤 설명 추가": "Added descriptions of create table (merge · split) · scale window · trace magnet snapping",
  "서로 가로지르는 배관 · 신호선을 자동으로 찾아 한쪽을 끊거나(틈) 반원으로 넘겨 표시 — 굵은 주 배관은 그대로, 가는 선 · 세로 선을 처리, T자 · 모서리 연결은 건드리지 않음, 표 · 도면 틀은 제외": "Automatically finds pipes · signal lines crossing each other and breaks one (gap) or bridges it with a semicircle — thick main pipes are left as they are, thin lines · vertical lines are handled, T-junctions · corner connections are untouched, tables · drawing borders are excluded",
  "A0~A4 · B1~B4, 가로/세로 용지 크기의 테두리 · 중심 표시 · 표제란(도면명 · 도면 번호 · 축척 · 작성 · 검토 · 승인 · 날짜 · 용지)을 도면 축척에 맞춰 자동 작성": "Automatically creates the border · center marks · title block (drawing name · drawing number · scale · drawn by · checked by · approved by · date · paper) for A0~A4 · B1~B4, landscape/portrait paper, matched to the drawing scale",
  "범례 · 일람표": "Legend · schedules",
  "도면에 쓰인 기호 · 신호선만 모아 범례 표 자동 작성, 계기 일람표(태그 · 기능 풀이 · 설치 위치)와 기호 수량표를 창으로 보기 · 도면에 표로 넣기 · 엑셀용 CSV 저장": "Auto-creates a legend table from only the symbols · signal lines used in the drawing; the instrument schedule (tag · function description · installation location) and symbol quantity table can be viewed in a window · inserted into the drawing as a table · saved as CSV for Excel",
  "이어진 선 배관 지원": "Polyline piping support",
  "[이어진 선]으로 그린 배관 위에 기호를 놓아도 방향 자동 맞춤 + 선 자동 끊기, 배관 번호도 이어진 선을 따라 정렬": "Even when a symbol is placed on piping drawn with [Polyline], direction is aligned automatically + the line is auto-broken; pipe numbers also align along the polyline",
  "ISO 10628 방식 기호 · 계기": "ISO 10628 style symbols · instruments",
  "상자형 밸브 · 체크 밸브, ISO 펌프, 삼각형 리듀서, 플랜지 이음 · 노즐, 도면 연결 화살표, 벤트 캡, 스프링 안전 밸브 추가(기본 기호 80여 종), 계기 태그에 ISO 긴 원(현장 / 제어실) 모양 추가": "Added box-type valve · check valve, ISO pump, triangular reducer, flange joint · nozzle, drawing connection arrow, vent cap, spring safety valve (about 80 built-in symbols), and an ISO long circle (field / control room) shape for instrument tags",
  "문자 가운데 맞춤": "Text center alignment",
  "[문자 쓰기]에 [가운데 맞춤] 선택 추가(찍은 점이 글자의 정중앙), 특성 창에서 가로 · 세로 맞춤 변경": "Added a [Center] option to [Text] (the clicked point is the exact center of the text); horizontal · vertical alignment can be changed in the Properties window",
  "참고 공정도(저장 탱크 T001 — 펌프 P001 계통)를 이 프로그램의 명령만으로 그대로 작성해 확인 (samples/pid-test-replica.mcd)": "Recreated the reference process diagram (storage tank T001 — pump P001 system) using only this program's commands to verify (samples/pid-test-replica.mcd)",
  "배관 교차 표시 · 도면 틀 · 범례 · 일람표 · 문자 맞춤 설명 추가": "Added descriptions of pipe crossing marks · drawing border · legend · schedules · text alignment",
  "단추에 단축키 표시": "Shortcut keys shown on buttons",
  "안내 막대의 [완료] · [선택 완료] · [그대로](Enter), [취소] · [선택 해제](Esc), 옵션 단추(C · R …), 선택했을 때의 [이동](M) · [복사](CO) · [지우기](Del) 등에 단축키를 작게 표시, 마우스를 올리면 자세한 설명": "Small shortcut keys shown on the guide bar's [Done] · [Done selecting] · [As is] (Enter), [Cancel] · [Deselect] (Esc), option buttons (C · R …), and on [Move] (M) · [Copy] (CO) · [Erase] (Del) etc. when selected; hover for a detailed explanation",
  "기호 넣기 (P&ID 기호 라이브러리)": "Insert Symbol (P&ID symbol library)",
  "게이트 · 글로브 · 앵글 · 볼 · 플러그 · 버터플라이 · 체크 · 다이어프램 밸브와 구동부 조합(수동 · 공압 · 전동 · 유압 · 솔레노이드 · 피스톤), 안전 밸브 · 감압 밸브, 고장 시 위치(FC/FO), 끝 연결 방식, 로터미터 · 압력계 · 오리피스 · 리듀서 · 펌프 · 계기 · 용기 · 탱크 · 탑 · 열교환기 · 압축기 · 스팀 트랩 · 도면 연결 기호 등 70여 종을 그림 목록에서 골라 바로 배치 — 배관 직선 위에 놓으면 방향 자동 맞춤 + 선 자동 끊기, 도면 축척에 맞춘 크기, 이름 검색, 참고 자료로 열람": "About 70 symbols to pick from a picture list and place right away: gate · globe · angle · ball · plug · butterfly · check · diaphragm valves with actuator combinations (manual · pneumatic · electric · hydraulic · solenoid · piston), safety valve · pressure-reducing valve, fail position (FC/FO), end connection type, rotameter · pressure gauge · orifice · reducer · pump · instrument · vessel · tank · tower · heat exchanger · compressor · steam trap · drawing connection symbols, etc. — placed on a straight pipe, they auto-align direction + auto-break the line; sized to the drawing scale, name search, viewable as reference material",
  "내 레퍼런스 (.rfdt)": "My References (.rfdt)",
  "직접 그린 객체를 이름 · 분류를 붙여 레퍼런스로 등록(레이어 · 색 · 선 모양 · 블록 포함), [기호 넣기] 창의 [★ 내 레퍼런스]에서 그림으로 골라 어느 도면에나 배치, 삭제, 고유 확장자 .rfdt 파일로 저장 · 불러오기(끌어다 놓기 가능)": "Register objects you drew as references with a name · category (including layers · colors · linetypes · blocks), pick them from the picture list under [★ My References] in the [Insert Symbol] window and place them in any drawing, delete them, and save · load them as .rfdt files (drag and drop supported)",

    moveGrip: (e, i, p, o) => {
      if (i === 0) { e.x1 = p.x; e.y1 = p.y; } else if (i === 1) { e.x2 = p.x; e.y2 = p.y; }
      else { const dx = p.x - (o.x1 + o.x2) / 2, dy = p.y - (o.y1 + o.y2) / 2; e.x1 = o.x1 + dx; e.y1 = o.y1 + dy; e.x2 = o.x2 + dx; e.y2 = o.y2 + dy; }
    },
    props: [['시작 X', 'x1'], ['시작 Y', 'y1'], ['끝 X', 'x2'], ['끝 Y', 'y2']],
    info: e => [['길이', G.fmt(G.dist(e.x1, e.y1, e.x2, e.y2))], ['각도', G.fmt(G.deg(G.norm(Math.atan2(e.y2 - e.y1, e.x2 - e.x1))), 2) + '°']]
  };

  // ---------- CIRCLE ----------
  const quads = (cx, cy, r) => [0, 1, 2, 3].map(k => ({ x: cx + r * Math.cos(k * PI / 2), y: cy + r * Math.sin(k * PI / 2), k: 'qua' }));
  T.CIRCLE = {
    prims: e => [G.A(e.cx, e.cy, e.r, 0, TAU)],
    snaps: e => [{ x: e.cx, y: e.cy, k: 'cen' }, ...quads(e.cx, e.cy, e.r)],
    transform: (e, m) => { xf(m, e, 'cx', 'cy'); e.r *= M.scaleOf(m); },
    grips: e => [{ x: e.cx, y: e.cy }, ...quads(e.cx, e.cy, e.r)],
    moveGrip: (e, i, p) => { if (i === 0) { e.cx = p.x; e.cy = p.y; } else e.r = Math.max(1e-9, G.dist(e.cx, e.cy, p.x, p.y)); },
    props: [['중심 X', 'cx'], ['중심 Y', 'cy'], ['반지름', 'r']],
    info: e => [['지름', G.fmt(e.r * 2)], ['원주', G.fmt(TAU * e.r)], ['면적', G.fmt(PI * e.r * e.r)]]
  };

  // ---------- ARC (a1→a2 반시계, 라디안) ----------
  const arcPt = (e, a) => ({ x: e.cx + e.r * Math.cos(a), y: e.cy + e.r * Math.sin(a) });
  T.ARC = {
    prims: e => [G.A(e.cx, e.cy, e.r, e.a1, sweep(e.a1, e.a2))],
    snaps: e => {
      const sw = sweep(e.a1, e.a2), out = [{ ...arcPt(e, e.a1), k: 'end' }, { ...arcPt(e, e.a2), k: 'end' }, { ...arcPt(e, e.a1 + sw / 2), k: 'mid' }, { x: e.cx, y: e.cy, k: 'cen' }];
      for (let k = 0; k < 4; k++) if (G.norm(k * PI / 2 - e.a1) <= sw) out.push({ ...arcPt(e, k * PI / 2), k: 'qua' });
      return out;
    },
    transform: (e, m) => { const q = G.primTransform(T.ARC.prims(e)[0], m); e.cx = q.cx; e.cy = q.cy; e.r = q.r; e.a1 = q.a1; e.a2 = G.norm(q.a1 + q.sw); },
    grips: e => [arcPt(e, e.a1), arcPt(e, e.a2), arcPt(e, e.a1 + sweep(e.a1, e.a2) / 2), { x: e.cx, y: e.cy }],
    moveGrip: (e, i, p, o) => {
      if (i === 3) { e.cx = p.x; e.cy = p.y; return; }
      const pts = [arcPt(o, o.a1), arcPt(o, o.a1 + sweep(o.a1, o.a2) / 2), arcPt(o, o.a2)];
      pts[i === 0 ? 0 : i === 1 ? 2 : 1] = p;
      const a = E.arcFrom3(pts[0], pts[1], pts[2]); if (a) Object.assign(e, a);
    },
    props: [['중심 X', 'cx'], ['중심 Y', 'cy'], ['반지름', 'r'], ['시작각', 'a1', 'a'], ['끝각', 'a2', 'a']],
    info: e => [['호 길이', G.fmt(e.r * sweep(e.a1, e.a2))]]
  };

  // ---------- PLINE (pts: [{x,y,b}], closed) ----------
  T.PLINE = {
    prims: e => {
      const out = [], n = e.pts.length, m = e.closed ? n : n - 1;
      for (let i = 0; i < m; i++) { const a = e.pts[i], b = e.pts[(i + 1) % n]; out.push(G.bulgeArc(a.x, a.y, b.x, b.y, a.b || 0)); }
      return out;
    },
    snaps: e => {
      const out = e.pts.map(p => ({ x: p.x, y: p.y, k: 'end' }));
      for (const p of E.prims(e)) { const q = G.primPoint(p, 0.5); out.push({ x: q.x, y: q.y, k: 'mid' }); if (p.t === 'A') out.push({ x: p.cx, y: p.cy, k: 'cen' }); }
      return out;
    },
    transform: (e, m) => { const mir = M.isMirror(m); for (const p of e.pts) { xf(m, p, 'x', 'y'); if (mir && p.b) p.b = -p.b; } },
    grips: e => e.pts.map(p => ({ x: p.x, y: p.y })),
    moveGrip: (e, i, p) => { e.pts[i].x = p.x; e.pts[i].y = p.y; },
    info: e => {
      let len = 0; for (const p of E.prims(e)) len += G.primLen(p);
      const out = [['정점 수', e.pts.length], ['길이', G.fmt(len)], ['닫힘', e.closed ? CAD.t('예') : CAD.t('아니오')]];
      if (e.closed) out.push(['면적', G.fmt(Math.abs(E.plineArea(e)))]);
      return out;
    }
  };
  E.plineArea = e => {
    let a = 0; const n = e.pts.length;
    for (let i = 0; i < n; i++) { const p = e.pts[i], q = e.pts[(i + 1) % n]; a += (p.x * q.y - q.x * p.y) / 2; }
    for (const p of E.prims(e)) if (p.t === 'A') a += (p.rev ? -1 : 1) * p.r * p.r * (p.sw - Math.sin(p.sw)) / 2;
    return a;
  };

  // ---------- ELLIPSE (중심, 장축 벡터 mx,my, 비율, 매개변수 a1~a2) ----------
  E.ellPt = (e, u) => ({ x: e.cx + e.mx * Math.cos(u) - e.my * e.ratio * Math.sin(u), y: e.cy + e.my * Math.cos(u) + e.mx * e.ratio * Math.sin(u) });
  const ellFull = e => Math.abs(sweep(e.a1, e.a2) - TAU) < 1e-9;
  T.ELLIPSE = {
    prims: e => {
      const sw = sweep(e.a1, e.a2), n = Math.max(8, Math.ceil(sw / TAU * 96)), out = []; let p = E.ellPt(e, e.a1);
      for (let i = 1; i <= n; i++) { const q = E.ellPt(e, e.a1 + sw * i / n); out.push(G.L(p.x, p.y, q.x, q.y)); p = q; }
      return out;
    },
    snaps: e => {
      const out = [{ x: e.cx, y: e.cy, k: 'cen' }], sw = sweep(e.a1, e.a2);
      for (let k = 0; k < 4; k++) if (G.norm(k * PI / 2 - e.a1) <= sw) out.push({ ...E.ellPt(e, k * PI / 2), k: 'qua' });
      if (!ellFull(e)) out.push({ ...E.ellPt(e, e.a1), k: 'end' }, { ...E.ellPt(e, e.a2), k: 'end' });
      return out;
    },
    transform: (e, m) => {
      xf(m, e, 'cx', 'cy'); const x = m[0] * e.mx + m[2] * e.my, y = m[1] * e.mx + m[3] * e.my; e.mx = x; e.my = y;
      if (M.isMirror(m) && !ellFull(e)) { const t = e.a1; e.a1 = G.norm(-e.a2); e.a2 = G.norm(-t); }
    },
    grips: e => [{ x: e.cx, y: e.cy }, E.ellPt(e, 0)],
    moveGrip: (e, i, p) => { if (i === 0) { e.cx = p.x; e.cy = p.y; } else { e.mx = p.x - e.cx; e.my = p.y - e.cy; } },
    props: [['중심 X', 'cx'], ['중심 Y', 'cy'], ['축 비율', 'ratio']]
  };

  // ---------- POINT ----------
  T.POINT = {
    prims: () => [], bbox: e => [e.x, e.y, e.x, e.y],
    dist: (e, x, y) => G.dist(e.x, e.y, x, y),
    snaps: e => [{ x: e.x, y: e.y, k: 'nod' }],
    transform: (e, m) => xf(m, e, 'x', 'y'),
    grips: e => [{ x: e.x, y: e.y }], moveGrip: (e, i, p) => { e.x = p.x; e.y = p.y; },
    draw: (e, P, V) => { const q = M.apply(V, e.x, e.y); P.cross(q.x, q.y, 3); },
    props: [['X', 'x'], ['Y', 'y']]
  };

  // ---------- TEXT (ha 0왼쪽/1중심/2오른쪽, va 0기준선/1아래/2중간/3위, 줄바꿈 \n) ----------
  E.textLayout = e => {
    const lines = String(e.text).split('\n'), h = e.h, ls = h * 1.6, n = lines.length;
    let w = 0; for (const s of lines) w = Math.max(w, CAD.textWidth(s, h, e.font) * (e.wf || 1));
    const Ht = h + (n - 1) * ls;
    return { lines, w, Ht, ls, x0: e.ha === 1 ? -w / 2 : e.ha === 2 ? -w : 0, top: e.va === 3 ? 0 : e.va === 2 ? Ht / 2 : Ht };
  };
  const textLocal = (e, x, y) => { const c = Math.cos(-(e.rot || 0)), s = Math.sin(-(e.rot || 0)), dx = x - e.x, dy = y - e.y; return { x: dx * c - dy * s, y: dx * s + dy * c }; };
  const textWorld = (e, lx, ly) => { const c = Math.cos(e.rot || 0), s = Math.sin(e.rot || 0); return { x: e.x + lx * c - ly * s, y: e.y + lx * s + ly * c }; };
  T.TEXT = {
    prims: () => [],
    bbox: e => {
      const L = E.textLayout(e); let bb = null;
      for (const [lx, ly] of [[L.x0, L.top - L.Ht], [L.x0 + L.w, L.top - L.Ht], [L.x0 + L.w, L.top], [L.x0, L.top]]) { const p = textWorld(e, lx, ly); bb = G.bbUnion(bb, [p.x, p.y, p.x, p.y]); }
      return bb;
    },
    dist: (e, x, y) => { const L = E.textLayout(e), q = textLocal(e, x, y); return bbDist([L.x0, L.top - L.Ht, L.x0 + L.w, L.top], q.x, q.y); },
    snaps: e => [{ x: e.x, y: e.y, k: 'ins' }],
    transform: (e, m) => {
      const old = e.rot || 0; xf(m, e, 'x', 'y'); e.h *= M.scaleOf(m);
      let r = M.dirAngle(m, old);
      if (M.isMirror(m)) { const d = a => Math.abs(PI - Math.abs(PI - G.norm(a - old))); if (d(r + PI) < d(r)) { r += PI; e.ha = 2 - (e.ha || 0); } }
      e.rot = G.norm(r);
    },
    grips: e => [{ x: e.x, y: e.y }], moveGrip: (e, i, p) => { e.x = p.x; e.y = p.y; },
    draw: (e, P, V) => {
      const L = E.textLayout(e), s = M.scaleOf(V), hpx = e.h * s;
      if (hpx < 3) { const a = textWorld(e, L.x0, L.top - L.Ht / 2), b = textWorld(e, L.x0 + L.w, L.top - L.Ht / 2); P.prims([G.L(a.x, a.y, b.x, b.y)], V); return; }
      const ang = M.dirAngle(V, e.rot || 0);
      L.lines.forEach((str, i) => { const w = textWorld(e, 0, L.top - e.h - i * L.ls), q = M.apply(V, w.x, w.y); P.text(str, q.x, q.y, hpx, ang, e.ha || 0, e.font, e.wf || 1); });
    },
    props: [['내용', 'text', 's'], ['글꼴', 'font', 'f'], ['가로 맞춤', 'ha', 'o', [[0, '왼쪽'], [1, '가운데'], [2, '오른쪽']]], ['세로 맞춤', 'va', 'o', [[1, '아래(기준선)'], [2, '가운데'], [3, '위']]], ['높이', 'h'], ['폭 비율 (1 = 보통, 0.8 = 좁게)', 'wf'], ['회전', 'rot', 'a'], ['X', 'x'], ['Y', 'y']]
  };

  // ---------- INSERT (블록 참조) ----------
  E.ctxDoc = null; // 겹친(비활성) 도면을 그리거나 스냅할 때 블록을 찾을 도면
  E.block = name => (E.ctxDoc || CAD.doc).blocks[name];
  E.insertMatrix = (e, b) => M.mul(M.translate(e.x, e.y), M.mul(M.rotate(e.rot || 0), M.mul(M.scale(e.sx, e.sy), M.translate(-b.bx, -b.by))));
  // 내용이 없는 블록(예: 그림만 들어 있던 로고 블록)의 INSERT — 범위 계산에서 빼야 도면 범위가 엉뚱하게 커지지 않는다
  E.isEmptyIns = e => { if (e.type !== 'INSERT') return false; const b = E.block(e.name); return !b || !b.ents.length || b.ents.every(E.isEmptyIns); };
  E.blockBBox = b => { if (b._bb) return b._bb; let bb = null; for (const s of b.ents) { if (E.isEmptyIns(s)) continue; bb = G.bbUnion(bb, E.bbox(s)); } return b._bb = bb || [b.bx, b.by, b.bx, b.by]; };
  let insDepth = 0;
  T.INSERT = {
    prims: e => {
      const b = E.block(e.name), out = []; if (!b || insDepth > 8) return out;
      const B = E.insertMatrix(e, b), uni = M.isUniform(B);
      insDepth++;
      for (const s of b.ents) for (const p of E.prims(s)) {
        if (uni) out.push(G.primTransform(p, B));
        else { const pts = G.primFlatten(p).map(q => M.apply(B, q.x, q.y)); for (let i = 1; i < pts.length; i++) out.push(G.L(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y)); }
      }
      insDepth--; return out;
    },
    bbox: e => {
      const b = E.block(e.name); if (!b || insDepth > 8) return [e.x, e.y, e.x, e.y];
      insDepth++; const bb = E.blockBBox(b); insDepth--;
      const B = E.insertMatrix(e, b); let r = null;
      for (const [x, y] of [[bb[0], bb[1]], [bb[2], bb[1]], [bb[2], bb[3]], [bb[0], bb[3]]]) { const p = M.apply(B, x, y); r = G.bbUnion(r, [p.x, p.y, p.x, p.y]); }
      return r;
    },
    dist: (e, x, y) => {
      const b = E.block(e.name); if (!b || insDepth > 8) return Infinity;
      const B = E.insertMatrix(e, b), q = M.apply(M.invert(B), x, y), s = M.scaleOf(B); let d = Infinity;
      insDepth++;
      for (const sub of b.ents) { if (bbDist(E.bbox(sub), q.x, q.y) * s >= d) continue; d = Math.min(d, E.dist(sub, q.x, q.y) * s); }
      insDepth--; return d;
    },
    snaps: e => {
      if (e._sn) return e._sn;
      const out = [{ x: e.x, y: e.y, k: 'ins' }], b = E.block(e.name);
      if (b && insDepth <= 8) {
        const B = E.insertMatrix(e, b); insDepth++;
        for (const sub of b.ents) { if (out.length > 5000) break; for (const sp of E.snaps(sub)) { const p = M.apply(B, sp.x, sp.y); out.push({ x: p.x, y: p.y, k: sp.k }); } }
        insDepth--;
      }
      return e._sn = out;
    },
    transform: (e, m) => { const r = M.dirAngle(m, e.rot || 0); xf(m, e, 'x', 'y'); const s = M.scaleOf(m); e.sx *= s; e.sy *= s; if (M.isMirror(m)) e.sy = -e.sy; e.rot = G.norm(r); },
    grips: e => [{ x: e.x, y: e.y }], moveGrip: (e, i, p) => { e.x = p.x; e.y = p.y; },
    draw: (e, P, V, styler, st, depth) => {
      const b = E.block(e.name); if (!b || depth > 8) return;
      const V2 = M.mul(V, E.insertMatrix(e, b)), inv = M.invert(V2); let vr = null;
      for (const [x, y] of [[0, 0], [P.w, 0], [P.w, P.h], [0, P.h]]) { const p = M.apply(inv, x, y); vr = G.bbUnion(vr, [p.x, p.y, p.x, p.y]); }
      const inh = { layer: st.layerName, aci: st.aci };
      for (const sub of b.ents) if (G.bbOverlap(E.bbox(sub), vr)) E.draw(sub, P, V2, styler, inh, depth + 1);
    },
    props: [['X', 'x'], ['Y', 'y'], ['X 축척', 'sx'], ['Y 축척', 'sy'], ['회전', 'rot', 'a']],
    info: e => [['블록 이름', e.name]]
  };

  // ---------- DIM (치수) ----------
  const readable = a => { a = G.norm(a); return (a > PI / 2 + 1e-6 && a <= 3 * PI / 2 + 1e-6) ? a - PI : a; };
  E.dimGeom = e => {
    if (e._dg) return e._dg;
    const s = e.s || 1, AL = 2.5 * s, TH = (e.th || 2.5) * s, GAP = 0.625 * s, EXO = 0.625 * s, EXE = 1.25 * s;
    const prims = [], arrows = []; let text = null, meas = 0, str = '';
    const val = v => e.text ? String(e.text).replace('<>', v) : v;
    if (e.kind === 'lin' || e.kind === 'ali') {
      const ang = e.kind === 'ali' ? Math.atan2(e.y2 - e.y1, e.x2 - e.x1) : (e.ang || 0);
      const ux = Math.cos(ang), uy = Math.sin(ang), nx = -uy, ny = ux;
      const d1 = (e.dx - e.x1) * nx + (e.dy - e.y1) * ny, d2 = (e.dx - e.x2) * nx + (e.dy - e.y2) * ny;
      const ax = e.x1 + nx * d1, ay = e.y1 + ny * d1, bx = e.x2 + nx * d2, by = e.y2 + ny * d2;
      meas = Math.abs((bx - ax) * ux + (by - ay) * uy);
      const s1 = d1 >= 0 ? 1 : -1, s2 = d2 >= 0 ? 1 : -1;
      if (Math.abs(d1) > EXO) prims.push(G.L(e.x1 + nx * EXO * s1, e.y1 + ny * EXO * s1, ax + nx * EXE * s1, ay + ny * EXE * s1));
      if (Math.abs(d2) > EXO) prims.push(G.L(e.x2 + nx * EXO * s2, e.y2 + ny * EXO * s2, bx + nx * EXE * s2, by + ny * EXE * s2));
      const da = meas > 1e-9 ? Math.atan2(by - ay, bx - ax) : ang;
      prims.push(G.L(ax, ay, bx, by));
      if (meas >= 4 * AL) arrows.push({ x: ax, y: ay, a: da, l: AL }, { x: bx, y: by, a: da + PI, l: AL });
      else {
        const c = Math.cos(da), sn = Math.sin(da);
        prims.push(G.L(ax, ay, ax - c * 2 * AL, ay - sn * 2 * AL), G.L(bx, by, bx + c * 2 * AL, by + sn * 2 * AL));
        arrows.push({ x: ax, y: ay, a: da + PI, l: AL }, { x: bx, y: by, a: da, l: AL });
      }
      const rot = readable(ang), k = GAP + TH / 2; str = val(G.fmt(meas, e.dec ?? 2));
      text = { x: (ax + bx) / 2 - Math.sin(rot) * k, y: (ay + by) / 2 + Math.cos(rot) * k, rot };
    } else if (e.kind === 'rad' || e.kind === 'dia') {
      const d = Math.atan2(e.dy - e.cy, e.dx - e.cx), c = Math.cos(d), sn = Math.sin(d), r = e.r;
      const px = e.cx + r * c, py = e.cy + r * sn, ox = e.cx - r * c, oy = e.cy - r * sn, dl = G.dist(e.cx, e.cy, e.dx, e.dy);
      meas = e.kind === 'rad' ? r : 2 * r; str = val((e.kind === 'rad' ? 'R' : 'Ø') + G.fmt(meas, e.dec ?? 2));
      const tw = CAD.textWidth(str, TH, e.font), out = dl > r;
      const ex = out ? e.dx + c * (tw / 2 + GAP) : px, ey = out ? e.dy + sn * (tw / 2 + GAP) : py;
      if (e.kind === 'dia') { prims.push(G.L(ox, oy, ex, ey)); arrows.push({ x: px, y: py, a: d + PI, l: AL }, { x: ox, y: oy, a: d, l: AL }); }
      else if (out) { prims.push(G.L(px, py, ex, ey)); arrows.push({ x: px, y: py, a: d, l: AL }); }
      else { prims.push(G.L(e.cx, e.cy, px, py)); arrows.push({ x: px, y: py, a: d + PI, l: AL }); }
      const cm = 1.25 * s; prims.push(G.L(e.cx - cm, e.cy, e.cx + cm, e.cy), G.L(e.cx, e.cy - cm, e.cx, e.cy + cm));
      const rot = readable(d), k = GAP + TH / 2;
      text = { x: e.dx - Math.sin(rot) * k, y: e.dy + Math.cos(rot) * k, rot };
    } else if (e.kind === 'ang') {
      const a1 = Math.atan2(e.y1 - e.cy, e.x1 - e.cx), a2 = Math.atan2(e.y2 - e.cy, e.x2 - e.cx);
      const th = G.norm(Math.atan2(e.dy - e.cy, e.dx - e.cx)), r = G.dist(e.cx, e.cy, e.dx, e.dy);
      const rays = [a1, a1 + PI, a2, a2 + PI].map(G.norm).sort((p, q) => p - q);
      let sa = rays[3], ea = rays[0] + TAU;
      for (let i = 0; i < 3; i++) if (th >= rays[i] && th < rays[i + 1]) { sa = rays[i]; ea = rays[i + 1]; }
      const sw = ea - sa; meas = G.deg(sw); str = val(G.fmt(meas, e.dec ?? 2) + '°');
      prims.push(G.A(e.cx, e.cy, r, sa, sw));
      const flip = r * sw < 4 * AL ? PI : 0;
      arrows.push({ x: e.cx + r * Math.cos(sa), y: e.cy + r * Math.sin(sa), a: sa + PI / 2 + flip, l: AL }, { x: e.cx + r * Math.cos(ea), y: e.cy + r * Math.sin(ea), a: ea - PI / 2 + flip, l: AL });
      for (const ra of [sa, ea]) {
        let from = EXO;

    prims: () => [],

    prims: () => [],

    transform: (e, m) => {

<script>
'use strict';
// METACADY document: 도면 데이터, 레이어, 선택, 실행취소
(function (CAD) {
  const E = CAD.ent;

  CAD.TEMPLATES = {
    mech: { name: '기계 부품도', dimscale: 1, layers: [
      ['외형선', 7, 'CONTINUOUS', 0.5], ['중심선', 1, 'CENTER', 0.18], ['숨은선', 2, 'HIDDEN', 0.25], ['가상선', 6, 'PHANTOM', 0.18],
      ['치수', 3, 'CONTINUOUS', 0.18], ['문자', 4, 'CONTINUOUS', 0.25], ['해칭', 8, 'CONTINUOUS', 0.13], ['도면틀', 7, 'CONTINUOUS', 0.35]] },
    plant: { name: '공장 · 공정시설', dimscale: 100, layers: [
      ['그리드', 8, 'CENTER', 0.13], ['건축-벽체', 7, 'CONTINUOUS', 0.5], ['건축-기둥', 7, 'CONTINUOUS', 0.5], ['건축-개구부', 4, 'CONTINUOUS', 0.25],
      ['설비-장비', 3, 'CONTINUOUS', 0.35], ['설비-탱크', 140, 'CONTINUOUS', 0.35], ['설비-컨베이어', 30, 'CONTINUOUS', 0.25],
      ['배관-공정', 5, 'CONTINUOUS', 0.35], ['배관-유틸리티', 6, 'DASHED', 0.25], ['덕트', 200, 'CONTINUOUS', 0.25], ['전기-트레이', 1, 'DASHDOT', 0.25],
      ['안전-통로', 2, 'DASHED', 0.25], ['구역경계', 40, 'PHANTOM', 0.35], ['치수', 3, 'CONTINUOUS', 0.18], ['문자', 4, 'CONTINUOUS', 0.25], ['중심선', 1, 'CENTER', 0.18]] }
  };

  class Doc {
    constructor() {

    // ----- 트랜잭션 -----
    begin(name) { if (this.tx) this.commit(); this.tx = { name, add: [], del: [], mod: new Map(), layers: null }; }
    auto() { if (!this.tx) { this.begin('편집'); return true; } return false; }
    snapLayers() { if (this.tx && !this.tx.layers) this.tx.layers = JSON.stringify({ l: this.layers, c: this.cur, s: this.settings }); }
    add(e) {
      const own = this.auto();
      e.id = this.nextId++; if (!e.layer) e.layer = this.cur; if (e.color === undefined) e.color = 256; if (!e.ltype) e.ltype = 'BYLAYER';

    }

      if (!Array.isArray(list)) list = [list]; if (!list.length) return;

    modify(e, fn) {

    commit() {

      if (t.layersAfter) this.restoreLayers(t.layersAfter);
      this.undoStack.push(t); this.sel.clear(); this.dirty = true; CAD.emit('change'); CAD.emit('sel'); return CAD.t(t.name);
    }

    // ----- 선택 -----
    select(list, on = true) { for (const e of list) on ? this.sel.add(e) : this.sel.delete(e); CAD.emit('sel'); }
    clearSel() { if (this.sel.size) { this.sel.clear(); CAD.emit('sel'); } }

    extents(onlyVisible = true) {
      let bb = null;
      for (const e of this.ents) { if (onlyVisible) { const l = this.layer(e.layer); if (l && !l.on) continue; } if (E.isEmptyIns(e)) continue; const b = E.bbox(e); if (isFinite(b[0]) && isFinite(b[2])) bb = CAD.geom.bbUnion(bb, b); }

      const d = new Doc(); if (o.name) d.fileName = o.name;
      d.layers = o.layers; d.cur = o.cur; Object.assign(d.settings, o.settings); d.blocks = o.blocks || {}; d.ents = o.ents || []; d.ltypes = o.ltypes || {};
      let id = 1; for (const e of d.ents) e.id = id++; d.nextId = id;
      if (!d.layer(d.cur)) d.cur = d.layers[0].name;
      return d;
    }

<script>
'use strict';
// METACADY commands (1/2): 명령 등록부, 그리기 · 주석 · 유틸리티 명령
(function (CAD) {
  const G = CAD.geom, M = CAD.M, E = CAD.ent, mk = CAD.mk, view = CAD.view, PI = Math.PI, TAU = G.TAU;

    list: {}, alias: {},
    add(name, aliases, label, fn, opts = {}) { this.list[name] = { name, label, fn, aliases, ...opts }; for (const a of aliases) this.alias[a.toUpperCase()] = name; },
    resolve(s) {
      s = s.trim(); const u = s.toUpperCase(), q = CAD.hangulToQwerty(s).toUpperCase();

    }
  };
  const H = CAD.cmdHelpers = {
    End, last: { circleR: 10, filletR: 0, offset: 10, cham1: 0, cham2: 0, textH: 0, polyN: 6, block: '', hatchGap: 0, hatchAng: PI / 4, hatchPat: 'ANSI31' },
    need: async pr => { const v = await pr; if (v === null || v === undefined) throw new End(); return v; },
    pt: async pr => { const v = await pr; if (!v || typeof v !== 'object') throw new End(); return v; },
    annLayer: name => CAD.doc.layer(name) ? name : CAD.doc.cur,
    props: e => ({ layer: e.layer, color: e.color, ltype: e.ltype }),
    // 프리미티브를 끝점끼리 이어 체인으로 묶는다 → [{prims, closed}]

            if (near(e, ps)) ch.push(p); else if (near(e, pe)) ch.push(rev(p)); else if (near(s, pe)) ch.unshift(p); else if (near(s, ps)) ch.unshift(rev(p)); else continue;

    },
    primsToPline(prims, closed, base) {

  // ================= 그리기 =================
  C.add('LINE', ['L', '선'], '선', async c => {
    let p = await pt(c.getPoint(CAD.t('첫 번째 점 지정'))); const pts = [p], added = [];
    for (;;) {
      const kw = { U: CAD.t('명령취소') }; if (pts.length >= 3) kw.C = CAD.t('닫기');
      const q = await c.getPoint(CAD.t('다음 점 지정 또는'), { base: p, kw, preview: m => [mk.line(p, m)] });
      if (!q) return;
      if (q === 'U') { if (added.length) { doc().remove(added.pop()); pts.pop(); p = pts[pts.length - 1]; view.invalidate(); } continue; }
      if (q === 'C') { doc().add(mk.line(p, pts[0])); return; }
      if (G.dist(p.x, p.y, q.x, q.y) < 1e-12) continue;

  });

  C.add('CIRCLE', ['C', '원'], '원', async c => {
    if (c.popup) { const v = await CAD.ui.formDialog('circle', CAD.t('원 그리기'), [{ k: 'mode', label: CAD.t('크기 기준'), type: 'select', def: 'D', options: [['D', CAD.t('지름 (Ø, 끝에서 끝까지)')], ['R', CAD.t('반지름 (중심에서 가장자리까지)')]] }, { k: 'val', label: CAD.t('크기'), type: 'number', big: true, def: 20, min: 0.0001, unit: 'mm', quick: [5, 10, 20, 50, 100] }],
        { info: q => q.val > 0 ? CAD.t('반지름 {r}  ·  지름 {d} mm  —  [도면에 놓기]를 누른 뒤 중심이 될 곳을 클릭하세요 (계속 클릭 = 여러 개)', { r: G.fmt(q.mode === 'D' ? q.val / 2 : q.val, 4), d: G.fmt(q.mode === 'D' ? q.val : q.val * 2, 4) }) : CAD.t('크기를 입력하세요'), manual: CAD.t('마우스로 직접 그리기 (3점 · 2점 포함)') });
      if (!v) throw new CAD.Cancel();
      if (v !== 'manual') { const r = v.mode === 'D' ? v.val / 2 : v.val; if (!(r > 0)) return; last.circleR = r; for (;;) { const p = await c.getPoint(CAD.t('원의 중심 위치 지정 또는 Enter(종료)'), { preview: m => [mk.circle(m, r)] }); if (!p || typeof p !== 'object') break; doc().add(mk.circle(p, r)); view.invalidate(); } return; } }
    const p = await need(c.getPoint(CAD.t('원의 중심점 지정 또는'), { kw: { '3P': CAD.t('3점'), '2P': CAD.t('2점') } }));
    if (p === '3P') {
      const a = await pt(c.getPoint(CAD.t('첫 번째 점 지정'))), b = await pt(c.getPoint(CAD.t('두 번째 점 지정'), { base: a }));
      const f = m => { const k = G.circle3(a, b, m); return k ? [mk.circle({ x: k.cx, y: k.cy }, k.r)] : []; };
      const d = await pt(c.getPoint(CAD.t('세 번째 점 지정'), { base: b, rubber: false, preview: f })), k = G.circle3(a, b, d);
      if (k) doc().add(mk.circle({ x: k.cx, y: k.cy }, k.r)); return;
    }
    if (p === '2P') {
      const a = await pt(c.getPoint(CAD.t('지름의 첫 번째 끝점 지정')));
      const f = m => [mk.circle({ x: (a.x + m.x) / 2, y: (a.y + m.y) / 2 }, G.dist(a.x, a.y, m.x, m.y) / 2)];
      const b = await pt(c.getPoint(CAD.t('지름의 두 번째 끝점 지정'), { base: a, preview: f })); doc().add(f(b)[0]); return;
    }
    let r = await need(c.getDist(CAD.t('원의 반지름 지정 또는'), { base: p, kw: { D: CAD.t('지름') }, def: last.circleR, preview: m => [mk.circle(p, G.dist(p.x, p.y, m.x, m.y))] }));
    if (r === 'D') r = await need(c.getDist(CAD.t('원의 지름 지정'), { base: p, def: last.circleR * 2, preview: m => [mk.circle(p, G.dist(p.x, p.y, m.x, m.y) / 2)] })) / 2;
    if (r > 0) { last.circleR = r; doc().add(mk.circle(p, r)); }
  });

  C.add('ARC', ['A', '호'], '호', async c => {
    const p1 = await need(c.getPoint(CAD.t('호의 시작점 지정 또는'), { kw: { C: CAD.t('중심') } }));
    if (p1 === 'C') {
      const o = await pt(c.getPoint(CAD.t('호의 중심점 지정'))), s = await pt(c.getPoint(CAD.t('호의 시작점 지정'), { base: o }));
      const r = G.dist(o.x, o.y, s.x, s.y), a1 = Math.atan2(s.y - o.y, s.x - o.x), f = m => [mk.arc(o.x, o.y, r, a1, Math.atan2(m.y - o.y, m.x - o.x))];
      const e = await pt(c.getPoint(CAD.t('호의 끝점 지정 (반시계 방향)'), { base: o, preview: f })); if (r > 0) doc().add(f(e)[0]); return;
    }
    const p2 = await pt(c.getPoint(CAD.t('호의 두 번째 점 지정'), { base: p1 }));
    const f = m => { const a = E.arcFrom3(p1, p2, m); return a ? [{ type: 'ARC', ...a }] : []; };
    const p3 = await pt(c.getPoint(CAD.t('호의 끝점 지정'), { base: p2, rubber: false, preview: f })); const a = f(p3)[0]; if (a) doc().add(a);
  });

  C.add('PLINE', ['PL', '폴리선'], '폴리선', async c => {
    const p0 = await pt(c.getPoint(CAD.t('시작점 지정'))), pts = [{ x: p0.x, y: p0.y, b: 0 }]; let arc = false, dir = 0, closed = false;
    const lastP = () => pts[pts.length - 1];
    const push = q => {
      const l = lastP();
      if (arc) { l.b = H.bulgeTo(l, dir, q); dir = G.primTangent(G.bulgeArc(l.x, l.y, q.x, q.y, l.b), 1); } else { l.b = 0; dir = Math.atan2(q.y - l.y, q.x - l.x); }
      pts.push({ x: q.x, y: q.y, b: 0 });
    };
    const prev = m => { const q = pts.map(v => ({ ...v })); if (arc) q[q.length - 1].b = H.bulgeTo(lastP(), dir, m); q.push({ x: m.x, y: m.y, b: 0 }); return [mk.pline(q, false)]; };
    try {
      for (;;) {
        const kw = arc ? { L: CAD.t('선') } : { A: CAD.t('호') }; if (pts.length >= 3) kw.C = CAD.t('닫기'); if (pts.length >= 2) kw.U = CAD.t('명령취소');
        const q = await c.getPoint(arc ? CAD.t('호의 끝점 지정 또는') : CAD.t('다음 점 지정 또는'), { base: lastP(), kw, preview: prev });
        if (!q) break;

  });

  C.add('RECTANG', ['REC', 'RECTANGLE', '사각형'], '직사각형', async c => {
    if (c.popup) { const v = await CAD.ui.formDialog('rect', CAD.t('사각형 그리기'), [{ k: 'w', label: CAD.t('가로'), type: 'number', big: true, def: 100, min: 0.0001, unit: 'mm' }, { k: 'h', label: CAD.t('세로'), type: 'number', big: true, def: 50, min: 0.0001, unit: 'mm' },
        { k: 'r', label: CAD.t('모서리 둥글게'), type: 'number', def: 0, min: 0, unit: 'mm', hint: CAD.t('0 = 각진 모서리 · 숫자 = 둥근 모서리 반지름') }, { k: 'at', label: CAD.t('클릭할 곳'), type: 'select', def: 'bl', options: [['bl', CAD.t('왼쪽 아래 구석')], ['cc', CAD.t('사각형의 가운데')], ['tl', CAD.t('왼쪽 위 구석')]] }],
        { info: q => q.w > 0 && q.h > 0 ? (q.r > 0 && q.r * 2 > Math.min(q.w, q.h) ? CAD.t('모서리 반지름이 너무 큽니다 (짧은 변의 절반까지)') : CAD.t('가로 {w} × 세로 {h} mm  —  [도면에 놓기]를 누른 뒤 놓을 자리를 클릭하세요', { w: G.fmt(q.w, 4), h: G.fmt(q.h, 4) })) : CAD.t('가로 · 세로를 입력하세요'), manual: CAD.t('마우스로 직접 그리기 (두 구석 클릭)') });
      if (!v) throw new CAD.Cancel();

        const shape = m => { const x = v.at === 'cc' ? m.x - v.w / 2 : m.x, y = v.at === 'cc' ? m.y - v.h / 2 : v.at === 'tl' ? m.y - v.h : m.y; if (!(r > 0)) return mk.rect({ x, y }, { x: x + v.w, y: y + v.h });
          return { type: 'PLINE', closed: true, pts: [{ x: x + r, y, b: 0 }, { x: x + v.w - r, y, b }, { x: x + v.w, y: y + r, b: 0 }, { x: x + v.w, y: y + v.h - r, b }, { x: x + v.w - r, y: y + v.h, b: 0 }, { x: x + r, y: y + v.h, b }, { x, y: y + v.h - r, b: 0 }, { x, y: y + r, b }] }; };
        for (;;) { const p = await c.getPoint(CAD.t('사각형을 놓을 위치 지정 또는 Enter(종료)'), { preview: m => [shape(m)] }); if (!p || typeof p !== 'object') break; doc().add(shape(p)); view.invalidate(); } return; } }
    const a = await pt(c.getPoint(CAD.t('첫 번째 구석점 지정'))), b = await pt(c.getCorner(CAD.t('반대 구석점 지정 (예: 100,50)'), a));
    if (Math.abs(a.x - b.x) > 1e-12 && Math.abs(a.y - b.y) > 1e-12) doc().add(mk.rect(a, b));
  });

  C.add('POLYGON', ['POL', '다각형'], '정다각형', async c => {
    /* 먼저 작은 창에서 변의 수 · 크기 · 회전을 숫자로 정하고, 도면에서는 놓을 자리(중심)만 찍는다. [마우스로 직접 그리기]는 예전 방식 */

      const shape = o => { const pts = []; for (let i = 0; i < ask.n; i++) pts.push(G.polar(o.x, o.y, ask.a0 + i * TAU / ask.n, ask.R)); return mk.pline(pts, true); };
      for (;;) { const p = await c.getPoint(CAD.t('{n}각형의 중심 위치 지정 또는 Enter(종료)', { n: ask.n }), { preview: m => [shape(m)] }); if (!p || typeof p !== 'object') break; doc().add(shape(p)); view.invalidate(); }
      return;
    }
    const n = Math.round(await need(c.getNumber(CAD.t('면의 수 입력'), { def: last.polyN }))); if (n < 3 || n > 1024) return; last.polyN = n;
    const o = await pt(c.getPoint(CAD.t('다각형의 중심 지정'))), mode = await c.getKeyword(CAD.t('옵션 입력'), { I: CAD.t('원에 내접'), C: CAD.t('원에 외접') }, 'I');
    const f = m => {
      let r = G.dist(o.x, o.y, m.x, m.y), a = Math.atan2(m.y - o.y, m.x - o.x); if (mode === 'C') { r /= Math.cos(PI / n); a += PI / n; }
